<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Cybertron Society Portal</title>
    <style>
        body { background-color: #0d1117; color: #00d2ff; font-family: sans-serif; text-align: center; padding-top: 100px; }
        h1 { font-size: 50px; text-shadow: 0 0 20px #00d2ff; }
        p { color: #8b949e; font-size: 20px; }
        .portal { width: 200px; height: 200px; border: 2px dashed #00d2ff; border-radius: 50%; margin: 40px auto; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 10px #00d2ff; } 50% { box-shadow: 0 0 50px #00d2ff; } 100% { box-shadow: 0 0 10px #00d2ff; } }
    </style>
</head>
<body>
    <h1>🌌 Cybertron Society</h1>
    <p>ยินดีต้อนรับสู่ประตูมิติของสังคมมนุษย์ดิจิทัล</p>
    <div class="portal">
        <span>ประตูมิติ<br>(พร้อมใช้งาน)</span>
    </div>
</body>
</html>
