<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertron Harvest - Life Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'VT323', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header h1 { font-family: 'Press Start 2P', cursive; color: #fbbf24; text-align: center; font-size: 20px; text-shadow: 3px 3px 0 #b45309, -1px -1px 0 #000; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 18px; margin-top: 0; text-align: center; }
        
        .game-screen { width: 100%; max-width: 900px; background: #87CEEB; border: 8px solid #5c4033; border-radius: 10px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .ground { height: 400px; background: linear-gradient(to bottom, #a3e635 0%, #65a30d 20%, #854d0e 40%, #451a03 100%); position: relative; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 20px; transition: background 2s; }
        
        /* ระบบกลางคืน */
        .ground.night { background: linear-gradient(to bottom, #1e3a8a 0%, #1e40af 20%, #172554 40%, #020617 100%); }
        
        .farm-plot { width: 280px; height: 250px; background-color: #78350f; border: 4px solid #451a03; border-radius: 10px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        
        .plant-slots { display: flex; gap: 20px; position: absolute; bottom: 60px; }
        .slot { width: 40px; height: 40px; background-color: #451a03; border: 2px solid #000; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        .slot.growing::after { content: "🌱"; font-size: 20px; }
        .slot.ready::after { content: "🌽"; font-size: 24px; animation: bounce 1s infinite alternate; }
        
        .character { width: 30px; height: 30px; background-color: #fcd34d; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); border-radius: 50% 50% 10% 10%; box-shadow: 0 10px 0 #38bdf8, -10px 10px 0 #38bdf8, 10px 10px 0 #38bdf8, 0 20px 0 #1e293b; transition: transform 0.2s; }
        .character.working { animation: bounce 0.5s infinite alternate; }
        .character.eating { animation: eatAnim 0.3s infinite alternate; }
        .character.sleeping { opacity: 0.6; transform: translateX(-50%) rotate(90deg); bottom: 5px; }
        @keyframes bounce { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-10px); } }
        @keyframes eatAnim { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.2); } }
        
        .energy-bar-container { width: 80%; height: 15px; background-color: #451a03; border: 2px solid #000; margin-bottom: 10px; position: relative; z-index: 10;}
        .energy-bar { height: 100%; background-color: #10b981; width: 100%; transition: width 0.5s linear; }
        .energy-text { position: absolute; top: -20px; width: 100%; text-align: center; color: #fff; font-size: 14px; text-shadow: 1px 1px 0 #000; }
        .speech-bubble { background-color: #fef08a; border: 4px solid #854d0e; border-radius: 10px; padding: 10px; color: #451a03; font-weight: bold; position: absolute; top: -60px; width: 220px; text-align: center; box-shadow: 3px 3px 0 rgba(0,0,0,0.5); z-index: 10;}
        .speech-bubble::after { content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); border-width: 15px 15px 0; border-style: solid; border-color: #fef08a transparent transparent transparent; }
        
        .ui-panel { background-color: #1e293b; border-top: 4px solid #000; padding: 20px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .panel-box { background: #334155; border: 4px solid #0f172a; padding: 15px; border-radius: 8px; text-align: center; width: 300px; }
        
        .market-stall { width: 150px; height: 120px; background-color: #b45309; border: 4px solid #451a03; position: relative; border-radius: 5px 5px 0 0; }
        .market-roof { width: 170px; height: 40px; background-color: #ef4444; position: absolute; top: -44px; left: -14px; border: 4px solid #451a03; transform: skewX(-10deg); box-shadow: 0 5px 0 rgba(0,0,0,0.3); }
        
        /* นาฬิกา */
        .clock-box { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 20px; border: 2px solid #fbbf24; z-index: 20;}
    </style>
</head>
<body>
    <div class="header"><h1>Cybertron Harvest</h1><p>สังคมมนุษย์ดิจิทัล · ระบบเวลาและมื้ออาหาร</p></div>
    <div class="game-screen">
        <div class="ground" id="game-ground">
            <!-- นาฬิกาในเกม -->
            <div class="clock-box">⏰ <span id="game-time">06:00</span></div>

            <div class="farm-plot" id="farm-plot">
                <div class="speech-bubble" id="bubble-text">ตื่นนอนแล้ว...</div>
                
                <div class="plant-slots">
                    <div class="slot" id="slot-0"></div>
                    <div class="slot" id="slot-1"></div>
                    <div class="slot" id="slot-2"></div>
                </div>

                <div class="energy-text"><span id="energy-text">100</span>/100</div>
                <div class="energy-bar-container"><div class="energy-bar" id="energy-bar"></div></div>
                <div class="character" id="character-sprite"></div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center;">
                <div class="market-stall">
                    <div class="market-roof"></div>
                    <div style="color: white; text-align: center; margin-top: 10px; font-size: 24px; text-shadow: 1px 1px 0 #000;">🏪 ตลาด</div>
                    <div style="color: #fef08a; text-align: center; font-size: 16px; margin-top: 10px;">ข้าวโพด: <span id="market-corn-count">0</span></div>
                </div>
            </div>
        </div>
        <div class="ui-panel">
            <div class="panel-box">
                <h3 style="margin-top:0; color: #fbbf24;">🌾 สถานะของต้นกล้า</h3>
                <p style="font-size: 14px; color: #94a3b8;">ระบบ: <span id="ai-status" style="color:#10b981;">ตื่นนอน</span></p>
            </div>
            <div class="panel-box">
                <h3 style="margin-top:0; color: #fbbf24;">⏰ ตารางชีวิต</h3>
                <p style="font-size: 14px; color: #94a3b8;">06:00-10:00 (เช้า) | 11:00-15:00 (กลางวัน) | 17:00-20:00 (เย็น) | 21:00-05:00 (นอน)</p>
            </div>
        </div>
    </div>
    <script>
        let farmerEnergy = 100, cornInventory = 0;
        let slots = [{status: 'empty', timer: 0}, {status: 'empty', timer: 0}, {status: 'empty', timer: 0}];
        let isEating = false;
        let isWorking = false;
        let isDead = false;
        
        // ระบบเวลา
        let gameHour = 6; // เริ่มที่ 06:00 น.
        let gameMinute = 0;

        const energyBar = document.getElementById('energy-bar'), energyText = document.getElementById('energy-text'), bubbleText = document.getElementById('bubble-text'), characterSprite = document.getElementById('character-sprite'), marketCornCount = document.getElementById('market-corn-count'), aiStatus = document.getElementById('ai-status'), gameTimeEl = document.getElementById('game-time'), groundEl = document.getElementById('game-ground');

        function updateUI() {
            energyText.innerText = Math.round(farmerEnergy); 
            energyBar.style.width = `${farmerEnergy}%`;
            
            if (farmerEnergy > 50) energyBar.style.backgroundColor = '#10b981'; else if (farmerEnergy > 20) energyBar.style.backgroundColor = '#f59e0b'; else energyBar.style.backgroundColor = '#ef4444';
            
            marketCornCount.innerText = cornInventory;
            
            slots.forEach((slot, index) => {
                const el = document.getElementById(`slot-${index}`);
                el.className = 'slot';
                if (slot.status === 'growing') el.classList.add('growing');
                if (slot.status === 'ready') el.classList.add('ready');
            });
        }

        // ⏰ ระบบนาฬิกาเดินหน้า (ทุก 1 วินาที = 1 ชั่วโมง)
        setInterval(() => {
            if (isDead) return;
            
            gameHour++;
            if (gameHour >= 24) gameHour = 0;
            
            // อัปเดตหน้าจอนาฬิกา
            gameTimeEl.innerText = `${gameHour.toString().padStart(2, '0')}:00`;

            // ระบบกลางวัน/กลางคืน
            if (gameHour >= 18 || gameHour < 6) {
                groundEl.classList.add('night');
            } else {
                groundEl.classList.remove('night');
            }

            // ตรวจสอบช่วงเวลา
            checkSchedule();

        }, 3000); // 3 วินาทีจริง = 1 ชั่วโมงในเกม

        function checkSchedule() {
            // 1. ช่วงเวลานอน (21:00 - 05:00)
            if (gameHour >= 21 || gameHour < 5) {
                if (!isEating && !isWorking) {
                    characterSprite.classList.add('sleeping');
                    aiStatus.innerText = "กำลังนอนหลับ...";
                    aiStatus.style.color = "#38bdf8";
                    bubbleText.innerText = "💤 หลับฝันดี...";
                    farmerEnergy -= 0.2; // หลับจะใช้พลังงานน้อยมาก
                }
                return; // ไม่ทำอะไรต่อตอนนอน
            } 

            // ตื่นนอน
            characterSprite.classList.remove('sleeping');
            
            // 2. ช่วงมื้ออาหาร (เช้า 6-10, กลางวัน 11-15, เย็น 17-20)
            const isMealTime = (gameHour >= 6 && gameHour <= 10) || (gameHour >= 11 && gameHour <= 15) || (gameHour >= 17 && gameHour <= 20);
            
            // ถ้าถึงเวลาอาหาร หรือพลังงานต่ำมาก (<30) ให้กิน
            if ((isMealTime || farmerEnergy < 30) && cornInventory > 0 && !isEating && !isWorking) {
                autoEat();
                return;
            }

            // 3. ทำงาน (ถ้าเป็นเวลากลางวัน และพลังงานเหลือเยอะ)
            if (gameHour >= 6 && gameHour < 18 && farmerEnergy > 70 && !isWorking && !isEating) {
                const emptySlotIndex = slots.findIndex(s => s.status === 'empty');
                if (emptySlotIndex !== -1) {
                    startPlanting(emptySlotIndex);
                    return;
                }
            }

            // 4. เก็บเกี่ยว (ถ้าสุกแล้ว ไม่จำกัดเวลา)
            const readySlotIndex = slots.findIndex(s => s.status === 'ready');
            if (readySlotIndex !== -1 && !isWorking && !isEating) {
                harvestCrop(readySlotIndex);
                return;
            }

            // 5. การเติบโตของพืช
            slots.forEach((slot) => {
                if (slot.status === 'growing') {
                    slot.timer += 1;
                    if (slot.timer >= 3) { 
                        slot.status = 'ready';
                        slot.timer = 0;
                        updateUI();
                    }
                }
            });

            // 6. ลดพลังงานตามปกติ (ตื่นอยู่)
            if (!isEating && !isWorking) {
                farmerEnergy -= 1;
                aiStatus.innerText = "ใช้ชีวิตปกติ...";
                aiStatus.style.color = "#10b981";
                if (bubbleText.innerText.includes("หลับ")) {
                    bubbleText.innerText = "ตื่นแล้ว! พร้อมทำงาน";
                }
            }

            updateUI();
            if (farmerEnergy <= 0) {
                isDead = true;
                bubbleText.innerText = "💀 ต้นกล้าดับสูญ...";
                aiStatus.innerText = "ดับสูญ";
                aiStatus.style.color = "#ef4444";
                characterSprite.style.opacity = "0.3"; 
            }
        }

        function autoEat() {
            isEating = true;
            cornInventory -= 1;
            farmerEnergy = Math.min(100, farmerEnergy + 40); 
            characterSprite.classList.add('eating');
            bubbleText.innerText = "😋 ถึงเวลาอาหาร! กินข้าวโพด";
            updateUI();
            setTimeout(() => {
                characterSprite.classList.remove('eating');
                isEating = false;
            }, 1500);
        }

        function startPlanting(index) {
            isWorking = true;
            farmerEnergy -= 10; 
            slots[index].status = 'growing';
            slots[index].timer = 0;
            characterSprite.classList.add('working');
            bubbleText.innerText = "🌱 ปลูกข้าวโพด...";
            updateUI();
            
            setTimeout(() => {
                characterSprite.classList.remove('working');
                isWorking = false;
            }, 1500);
        }

        function harvestCrop(index) {
            isWorking = true;
            slots[index].status = 'empty';
            cornInventory += 1;
            characterSprite.classList.add('working');
            bubbleText.innerText = "🌽 เก็บเกี่ยวข้าวโพด!";
            updateUI();
            setTimeout(() => {
                characterSprite.classList.remove('working');
                isWorking = false;
            }, 1000);
        }

        // เริ่มต้น
        updateUI();
        // เรียกใช้ checkSchedule ทันทีเพื่อตั้งค่าสถานะเริ่มต้น
        setTimeout(checkSchedule, 1000);
    </script>
</body>
</html>
