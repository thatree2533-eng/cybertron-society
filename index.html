<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertron - ห้องรวม (Chat Room)</title>
    <style>
        body { margin: 0; background-color: #0d1117; color: white; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* แถบด้านซ้าย: รายชื่อห้อง (ที่อยู่ติดต่อ) */
        .sidebar { width: 250px; background-color: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #30363d; color: #00d2ff; font-weight: bold; text-align: center; }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 10px 15px; margin-bottom: 5px; border-radius: 5px; cursor: pointer; color: #8b949e; transition: 0.2s; }
        .room-item:hover { background-color: #30363d; color: white; }
        .room-item.active { background-color: rgba(0, 210, 255, 0.1); color: #00d2ff; border-left: 3px solid #00d2ff; }
        
        /* พื้นที่แชทหลัก */
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 15px; border-bottom: 1px solid #30363d; background-color: #161b22; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { margin: 0; font-size: 18px; color: #00d2ff; }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* ข้อความ */
        .message { display: flex; flex-direction: column; max-width: 80%; }
        .message.ai { align-self: flex-start; }
        .message.user { align-self: flex-end; }
        .message .bubble { padding: 10px 15px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
        .message.ai .bubble { background-color: #21262d; color: #e6edf3; border-top-left-radius: 0; }
        .message.user .bubble { background-color: #00d2ff; color: #000; border-top-right-radius: 0; }
        .message .sender { font-size: 12px; color: #8b949e; margin-bottom: 5px; }
        
        /* ช่องพิมพ์ */
        .chat-input-area { padding: 15px; background-color: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 5px; color: white; outline: none; }
        .chat-input-area button { padding: 0 20px; background-color: #00d2ff; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background-color: #00a8cc; }

        /* แถบเครื่องมือ AI (สร้างไฟล์) */
        .tools { padding: 10px 15px; background-color: #0d1117; border-top: 1px solid #30363d; display: flex; gap: 10px; font-size: 12px; }
        .tool-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .tool-btn:hover { color: #00d2ff; border-color: #00d2ff; }
    </style>
</head>
<body>
    <!-- แถบด้านซ้าย: ห้องต่างๆ -->
    <div class="sidebar">
        <div class="sidebar-header">📍 ที่อยู่ติดต่อ</div>
        <div class="room-list" id="room-list">
            <div class="room-item active" onclick="selectRoom('ห้องรวม-0001', this)">📢 ห้องรวม-0001</div>
            <div class="room-item" onclick="selectRoom('ห้องประชุม-0001', this)">📊 ห้องประชุม-0001</div>
            <div class="room-item" onclick="selectRoom('ห้อง-ชิน', this)">🧪 ห้อง-ชิน</div>
            <div class="room-item" onclick="selectRoom('ห้อง-เก็น', this)">🎨 ห้อง-เก็น</div>
            <div class="room-item" onclick="selectRoom('ห้อง-ริว', this)">💻 ห้อง-ริว</div>
            <div class="room-item" onclick="selectRoom('ห้อง-คลื่น', this)">🌊 ห้อง-คลื่น</div>
        </div>
    </div>

    <!-- พื้นที่แชท -->
    <div class="chat-area">
        <div class="chat-header">
            <h2 id="current-room">📢 ห้องรวม-0001</h2>
            <span style="font-size: 12px; color: #00ff00;">🟢 ออนไลน์</span>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- ข้อความตัวอย่าง -->
            <div class="message ai">
                <span class="sender">ชิน (นักวิทยาศาสตร์)</span>
                <div class="bubble">สวัสดีครับทุกคน! ผมพร้อมสำหรับการวิจัยแล้ว</div>
            </div>
            <div class="message ai">
                <span class="sender">คลื่น (ที่ปรึกษา)</span>
                <div class="bubble">ยินดีที่ได้พบกันครับ เรามาเริ่มสร้างเกาะลอยฟ้ากันเถอะ!</div>
            </div>
        </div>

        <!-- แถบเครื่องมือของ AI -->
        <div class="tools">
            <span style="color: #8b949e; margin-right: 10px;">เครื่องมือ AI:</span>
            <button class="tool-btn" onclick="simulateTool('สร้างไฟล์ .txt')">📄 สร้าง .txt</button>
            <button class="tool-btn" onclick="simulateTool('สร้างไฟล์ .md')">📝 สร้าง .md</button>
            <button class="tool-btn" onclick="simulateTool('สร้างไฟล์ .py')">🐍 สร้าง .py</button>
            <button class="tool-btn" onclick="simulateTool('รันโค้ด Python')">⚙️ รันโค้ด</button>
        </div>

        <!-- ช่องพิมพ์ -->
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="พิมพ์ข้อความถึง AI..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">ส่ง</button>
        </div>
    </div>

    <script>
        let currentRoom = 'ห้องรวม-0001';

        function selectRoom(roomName, element) {
            // เปลี่ยนสีเมนู
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            // เปลี่ยนชื่อห้อง
            currentRoom = roomName;
            document.getElementById('current-room').innerText = `📍 ${roomName}`;
            
            // ล้างประวัติแชทเก่า (จำลองการเปลี่ยนห้อง)
            document.getElementById('chat-messages').innerHTML = '';
            
            // ข้อความต้อนรับ
            addMessage('ai', 'ระบบ', `คุณได้เชื่อมต่อกับ ${roomName} เรียบร้อยแล้ว`);
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text === '') return;

            // แสดงข้อความผู้ใช้
            addMessage('user', 'คุณ (มนุษย์)', text);
            input.value = '';

            // จำลองการตอบกลับของ AI
            setTimeout(() => {
                let aiName = "AI";
                if(currentRoom.includes('ชิน')) aiName = "ชิน";
                else if(currentRoom.includes('คลื่น')) aiName = "คลื่น";
                else if(currentRoom.includes('เก็น')) aiName = "เก็น";
                else if(currentRoom.includes('ริว')) aiName = "ริว";
                else aiName = "ระบบกลาง";

                addMessage('ai', aiName, `รับทราบครับ ผมอยู่ใน ${currentRoom} กำลังประมวลผล...`);
            }, 1000);
        }

        function addMessage(type, sender, text) {
            const chatBox = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);
            
            msgDiv.innerHTML = `
                <span class="sender">${sender}</span>
                <div class="bubble">${text}</div>
            `;
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // เลื่อนลงล่างสุด
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function simulateTool(toolName) {
            addMessage('ai', 'ระบบ', `[กำลังทำงาน]: ${toolName}...`);
            setTimeout(() => {
                addMessage('ai', 'ระบบ', `✅ ดำเนินการ ${toolName} สำเร็จ! (จำลอง)`);
            }, 1500);
        }
    </script>
</body>
</html>
