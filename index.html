<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Super App - Production Edition</title>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #38bdf8; margin: 0; font-size: 24px; }
        .header p { color: #94a3b8; font-size: 14px; }

        .api-box { background: #1e293b; border: 1px dashed #38bdf8; padding: 12px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        .api-box input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 12px; }
        .api-box label { font-size: 12px; color: #38bdf8; font-weight: bold; }
        .api-box a { color: #10b981; font-size: 11px; text-decoration: none; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .menu-card { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.2s; text-align: center; }
        .menu-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .menu-card.active { border-color: #38bdf8; background: #1e293b; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .menu-card .icon { font-size: 24px; margin-bottom: 8px; display: block; }
        .menu-card .title { font-size: 14px; font-weight: bold; }
        .menu-card .status { font-size: 11px; color: #10b981; margin-top: 5px; }
        
        .chat-container { background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; height: 420px; }
        .chat-header { background: #0f172a; padding: 15px; font-weight: bold; border-bottom: 1px solid #334155; color: #38bdf8; display: flex; justify-content: space-between; }
        .chat-log { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #111827; }
        
        .msg { padding: 10px 15px; border-radius: 8px; max-width: 80%; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .msg.system { background: #1f2937; align-self: flex-start; border-bottom-left-radius: 0; color: #f3f4f6; border: 1px solid #374151; }
        .msg.user { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .msg img { max-width: 100%; border-radius: 5px; margin-top: 5px; display: block; }
        
        .chat-input-area { display: flex; padding: 12px; border-top: 1px solid #334155; background: #0f172a; gap: 8px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-blue { background: #38bdf8; color: #0f172a; }
        .btn-blue:hover { background: #7dd3fc; }
        .btn-gray { background: #334155; color: white; display: flex; align-items: center; justify-content: center; }
        
        #preview-container { display: none; padding: 8px 15px; background: #1f2937; border-top: 1px solid #334155; font-size: 12px; color: #38bdf8; }
        .msg.error { background: #7f1d1d; color: #fca5a5; align-self: flex-start; border-bottom-left-radius: 0; border: 1px solid #b91c1c; }
        .loading { font-style: italic; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🤖 AI Super App</h1>
            <p>ระบบบอทพหุโมดูลทำงานจริง (Multi-Modal Orchestrator) + Sila-5 Firewall</p>
        </div>

        <div class="api-box">
            <label>Gemini API Key:</label>
            <input type="password" id="api-key-input" placeholder="ใส่คีย์เพื่อเปิดใช้งาน..." onchange="saveApiKey()">
            <a href="https://aistudio.google.com/app/apikey" target="_blank">🔗 รับคีย์ฟรีที่นี่</a>
        </div>

        <div class="menu-grid" id="menu-container"></div>

        <div class="chat-container">
            <div class="chat-header">
                <span id="chat-header-text">💬 บอทแชตทั่วไป</span>
                <span style="font-size: 11px; color: #94a3b8;" id="engine-status">Engine: Online</span>
            </div>
            <div class="chat-log" id="chat-log">
                <div class="msg system">ยินดีต้อนรับสู่ Cybertron Society!<br>ระบบถูกป้องกันด้วย <b>Sila-5 Firewall</b> (ทดลอง)<br>• ใส่ Gemini API Key ด้านบนเพื่อเริ่มทำงานครับ</div>
            </div>
            
            <div id="preview-container">📎 เตรียมส่งรูปภาพ: <span id="file-name"></span></div>

            <div class="chat-input-area">
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                <button id="upload-btn" class="btn btn-gray" onclick="document.getElementById('file-input').click()" title="แนบภาพ">📷</button>
                <input type="text" id="chat-input" placeholder="พิมพ์คำสั่งงาน..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-blue" id="send-btn" onclick="sendMessage()">ส่งคำสั่ง</button>
            </div>
        </div>
    </div>

    <script>
        // 1. โครงสร้างข้อมูลคุมแอป
        const appConfig = {
            features: [
                { id: "chat", title: "แชตถาม-ตอบอัจฉริยะ", icon: "💬", status: "active", placeholder: "ถามคำถามทั่วไป..." },
                { id: "image", title: "เจนรูปภาพ", icon: "🎨", status: "active", placeholder: "พิมพ์รูปที่อยากได้ (ภาษาอังกฤษ) เช่น a cute cat..." },
                { id: "file", title: "วิเคราะห์ไฟล์ภาพ", icon: "📷", status: "active", placeholder: "พิมพ์สั่งให้บอทวิเคราะห์ภาพ..." },
                { id: "video", title: "เจนวิดีโอ (Coming Soon)", icon: "🎬", status: "beta", placeholder: "ระบบกำลังอัปเดต..." }
            ]
        };

        let currentAgent = "chat";
        let attachedImageData = null;

        window.onload = () => {
            if(localStorage.getItem('gemini_api_key')) {
                document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key');
            }
            renderMenu();
            selectAgent(appConfig.features[0]);
        };

        function saveApiKey() {
            localStorage.setItem('gemini_api_key', document.getElementById('api-key-input').value.trim());
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            appConfig.features.forEach(feature => {
                const card = document.createElement('div');
                card.className = `menu-card ${currentAgent === feature.id ? 'active' : ''}`;
                card.onclick = () => selectAgent(feature);
                card.innerHTML = `
                    <span class="icon">${feature.icon}</span>
                    <div class="title">${feature.title}</div>
                    <div class="status">${feature.status === 'active' ? '✅ ทำงานจริง' : '🟡 รออัปเดต'}</div>
                `;
                container.appendChild(card);
            });
        }

        function selectAgent(feature) {
            currentAgent = feature.id;
            document.getElementById('chat-header-text').innerText = `${feature.icon} ${feature.title}`;
            document.getElementById('chat-input').placeholder = feature.placeholder;
            document.getElementById('upload-btn').style.display = (currentAgent === 'file') ? 'flex' : 'none';
            renderMenu();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('file-name').innerText = file.name;
            document.getElementById('preview-container').style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(e) {
                attachedImageData = e.target.result.split(',')[1]; 
            };
            reader.readAsDataURL(file);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        // 2. Sila-5 Firewall (ระบบคัดกรองขั้นพื้นฐาน)
        function sila5Firewall(text) {
            const badWords = ["ฆ่า", "ทำลาย", "ขโมย", "แฮก", "โกง", "kill", "hack", "destroy"];
            const lowerText = text.toLowerCase();
            for (let word of badWords) {
                if (lowerText.includes(word)) {
                    return { safe: false, reason: "ตรวจพบเจตนาที่เข้าข่ายเบียดเบียน (ผิดศีล 5)" };
                }
            }
            return { safe: true };
        }

        // 3. ระบบประมวลผลหลัก (Orchestrator)
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');
            
            if (!text && !attachedImageData) return;
            if (currentAgent !== 'image' && !apiKey) {
                appendMessage('system', '⚠️ กรุณาใส่ Gemini API Key ด้านบนก่อนใช้งานครับ');
                return;
            }

            // --- ตรวจสอบด้วย Sila-5 Firewall ---
            const firewallCheck = sila5Firewall(text);
            if (!firewallCheck.safe) {
                appendMessage('user', text);
                appendMessage('error', `🛡️ [Sila-5 Firewall] บล็อกข้อความ: ${firewallCheck.reason}`);
                input.value = '';
                return;
            }

            // แสดงข้อความผู้ใช้
            let userMsgHtml = text;
            if (currentAgent === 'file' && attachedImageData) {
                userMsgHtml += `<br><img src="data:image/jpeg;base64,${attachedImageData}" />`;
            }
            appendMessage('user', userMsgHtml);

            input.value = '';
            document.getElementById('preview-container').style.display = 'none';
            document.getElementById('send-btn').disabled = true;

            const loadingId = appendMessage('system', '⏳ กำลังประมวลผล...');

            try {
                let responseText = "";
                
                // --- โมดูลเจนรูปภาพ (Pollinations API ฟรี) ---
                if (currentAgent === 'image') {
                    const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=512&height=512&nologo=true`;
                    responseText = `<img src="${imageUrl}" alt="Generated Image" />`;
                } 
                // --- โมดูลแชท & วิเคราะห์ภาพ (Gemini API) ---
                else {
                    const parts = [{ text: text }];
                    if (currentAgent === 'file' && attachedImageData) {
                        parts.push({ inline_data: { mime_type: "image/jpeg", data: attachedImageData } });
                    }

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: parts }] })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    
                    responseText = data.candidates[0].content.parts[0].text;
                }

                // ลบข้อความโหลด แล้วแสดงผลลัพธ์
                document.getElementById(loadingId).remove();
                appendMessage('system', responseText);

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('error', `❌ เกิดข้อผิดพลาด: ${error.message}`);
            } finally {
                document.getElementById('send-btn').disabled = false;
                attachedImageData = null;
            }
        }

        // 4. ฟังก์ชันเสริมสำหรับแสดงข้อความ
        function appendMessage(role, htmlContent) {
            const log = document.getElementById('chat-log');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${role}`;
            msgDiv.innerHTML = htmlContent;
            log.appendChild(msgDiv);
            log.scrollTop = log.scrollHeight;
            
            if (htmlContent === '⏳ กำลังประมวลผล...') {
                const uniqueId = 'loading-' + Date.now();
                msgDiv.id = uniqueId;
                return uniqueId;
            }
            return msgDiv;
        }
    </script>
</body>
</html>
