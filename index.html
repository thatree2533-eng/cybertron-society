<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Super App - Web Edition</title>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #38bdf8; margin: 0; font-size: 24px; }
        .header p { color: #94a3b8; font-size: 14px; }
        
        /* ส่วนแสดงผลเมนู (Server-Driven UI จำลอง) */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .menu-card { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.2s; text-align: center; }
        .menu-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .menu-card .icon { font-size: 24px; margin-bottom: 8px; display: block; }
        .menu-card .title { font-size: 14px; font-weight: bold; }
        .menu-card .status { font-size: 11px; color: #10b981; margin-top: 5px; }
        
        /* ส่วนแชท */
        .chat-container { background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; height: 400px; }
        .chat-header { background: #0f172a; padding: 15px; font-weight: bold; border-bottom: 1px solid #334155; color: #38bdf8; }
        .chat-log { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 10px 15px; border-radius: 8px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .msg.system { background: #334155; align-self: flex-start; border-bottom-left-radius: 0; }
        .msg.user { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        
        .chat-input-area { display: flex; padding: 15px; border-top: 1px solid #334155; background: #0f172a; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        .chat-input-area button { padding: 10px 20px; background: #38bdf8; color: #0f172a; border: none; border-radius: 5px; margin-left: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🤖 AI Super App</h1>
            <p>Server-Driven UI Simulation (Web Edition)</p>
        </div>

        <!-- เมนูที่วาดจาก Config -->
        <div class="menu-grid" id="menu-container">
            <!-- จะถูกสร้างด้วย JavaScript -->
        </div>

        <!-- หน้าต่างแชท -->
        <div class="chat-container">
            <div class="chat-header" id="chat-header">💬 บอทแชตทั่วไป</div>
            <div class="chat-log" id="chat-log">
                <div class="msg system">ระบบพร้อมใช้งาน พิมพ์คำสั่งเพื่อทดสอบได้เลยครับ</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="พิมพ์คำสั่ง เช่น วาดรูปแมวอวกาศ..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">ส่ง</button>
            </div>
        </div>
    </div>

    <script>
        // 1. จำลอง Config จาก Backend (Server-Driven UI)
        const appConfig = {
            features: [
                { id: "chat", title: "แชตถาม-ตอบ", icon: "💬", status: "active" },
                { id: "image", title: "เจนรูปภาพ", icon: "🎨", status: "active" },
                { id: "video", title: "เจนวิดีโอ", icon: "🎬", status: "beta" },
                { id: "file", title: "วิเคราะห์ไฟล์", icon: "📄", status: "active" }
            ]
        };

        let currentAgent = "Core_LLM_Chat";
        let currentTitle = "💬 บอทแชตทั่วไป";

        // 2. ฟังก์ชันวาดเมนู (เหมือน React ฝั่ง Frontend)
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            appConfig.features.forEach(feature => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.onclick = () => selectAgent(feature);
                
                card.innerHTML = `
                    <span class="icon">${feature.icon}</span>
                    <div class="title">${feature.title}</div>
                    <div class="status">${feature.status === 'active' ? '✅ พร้อมใช้งาน' : '🟡 ทดลอง'}</div>
                `;
                container.appendChild(card);
            });
        }

        // 3. ฟังก์ชันเปลี่ยน Agent (เหมือนระบบ Orchestrator)
        function selectAgent(feature) {
            currentAgent = feature.id;
            currentTitle = `${feature.icon} ${feature.title}`;
            document.getElementById('chat-header').innerText = currentTitle;
            
            const log = document.getElementById('chat-log');
            log.innerHTML = `<div class="msg system">เชื่อมต่อกับ ${feature.title} สำเร็จ (จำลอง)</div>`;
        }

        // 4. ฟังก์ชันส่งข้อความ (จำลอง Orchestrator Routing)
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const log = document.getElementById('chat-log');
            
            // โชว์ข้อความ User
            log.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            log.scrollTop = log.scrollHeight;

            // จำลองการตอบกลับของ Orchestrator (ตามคำที่พิมพ์)
            setTimeout(() => {
                let reply = "";
                let agentName = "Core_LLM_Chat";

                const lowerText = text.toLowerCase();
                if (lowerText.includes("วาด") || lowerText.includes("รูป") || lowerText.includes("ภาพ")) {
                    agentName = "Image_Agent_v2";
                    reply = `รับคำสั่งสร้างภาพ: "${text}"\n(จำลองการทำงานของ Image Agent)`;
                } else if (lowerText.includes("วิดีโอ") || lowerText.includes("คลิป")) {
                    agentName = "Video_Agent_v1";
                    reply = `รับคำสั่งสร้างวิดีโอ: "${text}"\n(จำลองการทำงานของ Video Agent)`;
                } else {
                    reply = `บอทแชตตอบกลับ: ได้รับข้อความ "${text}" แล้วครับ`;
                }

                log.innerHTML += `<div class="msg system">[${agentName}]<br>${reply}</div>`;
                log.scrollTop = log.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // เริ่มระบบ
        renderMenu();
    </script>
</body>
</html>
