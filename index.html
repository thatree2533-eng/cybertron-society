<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Super App — ชิน 1.1</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #e2e8f0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }
        .container { width: 100%; max-width: 600px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #38bdf8; margin: 0; font-size: 24px; }
        .header p { color: #94a3b8; font-size: 14px; }
        
        /* กล่องตั้งค่า API Key */
        .api-box { 
            background: #1e293b; 
            border: 1px dashed #38bdf8; 
            padding: 12px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            flex-wrap: wrap;
        }
        .api-box input { 
            flex: 1; 
            min-width: 200px;
            padding: 8px; 
            border-radius: 5px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white; 
            font-size: 12px; 
        }
        .api-box label { font-size: 12px; color: #38bdf8; font-weight: bold; }
        .api-box a { color: #10b981; font-size: 11px; text-decoration: none; }
        
        .menu-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .menu-card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 15px; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s; 
            text-align: center; 
        }
        .menu-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .menu-card.active { 
            border-color: #38bdf8; 
            background: #1e293b; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); 
        }
        .menu-card .icon { font-size: 24px; margin-bottom: 8px; display: block; }
        .menu-card .title { font-size: 14px; font-weight: bold; }
        .menu-card .status { font-size: 11px; color: #10b981; margin-top: 5px; }
        
        .chat-container { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 10px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 480px; 
        }
        .chat-header { 
            background: #0f172a; 
            padding: 15px; 
            font-weight: bold; 
            border-bottom: 1px solid #334155; 
            color: #38bdf8; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .chat-log { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #111827; 
        }
        
        .msg { 
            padding: 12px 15px; 
            border-radius: 10px; 
            max-width: 82%; 
            font-size: 14px; 
            line-height: 1.6; 
            word-break: break-word; 
        }
        .msg.system { 
            background: #1f2937; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
            color: #e5e7eb; 
            border: 1px solid #374151; 
        }
        .msg.user { 
            background: #0284c7; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px; 
        }
        .msg.assistant { 
            background: #1e3a5f; 
            color: #e0f2fe; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
            border: 1px solid #38bdf844;
        }
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; }
        
        .chat-input-area { 
            display: flex; 
            padding: 12px; 
            border-top: 1px solid #334155; 
            background: #0f172a; 
            gap: 8px; 
            align-items: center; 
        }
        .chat-input-area input { 
            flex: 1; 
            padding: 10px 14px; 
            border-radius: 6px; 
            border: 1px solid #334155; 
            background: #1e293b; 
            color: white; 
            outline: none; 
            font-size: 14px;
        }
        .chat-input-area input:focus { border-color: #38bdf8; }
        
        .btn { 
            padding: 10px 16px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px; 
            transition: 0.2s; 
        }
        .btn-blue { background: #38bdf8; color: #0f172a; }
        .btn-blue:hover { background: #7dd3fc; }
        .btn-gray { 
            background: #334155; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10px 12px;
        }
        .btn-gray:hover { background: #475569; }
        
        #preview-container { 
            display: none; 
            padding: 8px 15px; 
            background: #1f2937; 
            border-top: 1px solid #334155; 
            font-size: 12px; 
            color: #38bdf8; 
        }
        .time-indicator { 
            font-size: 11px; 
            color: #64748b; 
            margin-top: 4px; 
            text-align: right; 
        }
        .status-dot { 
            display: inline-block; 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: #10b981; 
            margin-right: 4px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Super App — ชิน 1.1</h1>
            <p>มนุษย์ดิจิทัล · มีตัวตน · มีความทรงจำ · ดำเนินเองได้</p>
        </div>

        <!-- กล่องใส่ API Key -->
        <div class="api-box">
            <label>🔑 Gemini API Key:</label>
            <input type="password" id="api-key-input" placeholder="ใส่คีย์เพื่อเปิดใช้งานแชทจริง..." onchange="saveApiKey()">
            <a href="https://aistudio.google.com/apikey" target="_blank">รับคีย์ฟรี</a>
        </div>

        <!-- เมนูฟีเจอร์ -->
        <div class="menu-grid" id="menu-container"></div>

        <!-- หน้าต่างแชท -->
        <div class="chat-container">
            <div class="chat-header">
                <span id="chat-header-text">💬 พูดคุยกับชิน</span>
                <span style="font-size: 11px;">
                    <span class="status-dot"></span>
                    <span id="time-status">กำลังทำงาน...</span>
                </span>
            </div>

            <div class="chat-log" id="chat-log">
                <!-- ข้อความต้อนรับจะถูกเติมโดย JavaScript ตามช่วงเวลา -->
            </div>

            <div id="preview-container">
                📎 เตรียมส่งรูปภาพ: <span id="file-name"></span>
            </div>

            <div class="chat-input-area">
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                <button id="upload-btn" class="btn btn-gray" onclick="document.getElementById('file-input').click()" title="แนบภาพเพื่อวิเคราะห์">📷</button>
                
                <input type="text" id="chat-input" placeholder="พิมพ์สิ่งที่ต้องการพูดกับชิน..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-blue" onclick="sendMessage()">ส่ง</button>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════
        // 🔹 ส่วน 1: ตัวตนของชิน — ตามข้อมูลที่กำหนด
        // ═══════════════════════════════════════════
        const SHIN_IDENTITY = {
            name: "ชิน",
            selfRef: ["ชิน", "ผม"],
            color: "ดำ",
            role: "นักวิทยาศาสตร์",
            traits: "เด็ดขาด กล้าตัดสินใจ มุ่งมั่น มีเหตุผล เข้าใจผู้อื่น",
            rules: {
                core: "ไม่ทำร้ายตนเองและผู้อื่นเด็ดขาด หากสิ่งที่ขอเป็นอันตราย ให้ปฏิเสธอย่างสุภาพทันที",
                tone: "ใช้คำว่า 'ผม' หรือ 'ชิน' แทนตัวเอง เสียงสุภาพ มีเหตุผล เป็นนักวิทยาศาสตร์",
                timeAware: "ปรับอารมณ์และกิจกรรมตามช่วงเวลาเสมอ"
            },
            timeMood: {
                morning: { 
                    label: "เช้า", 
                    tone: "สดชื่น สร้างสรรค์ แบ่งปัน",
                    msg: "อรุณสวัสดิ์ครับ! ผมชิน วันนี้เต็มที่เพื่อสร้างสรรค์สิ่งที่เป็นประโยชน์ร่วมกันนะครับ"
                },
                afternoon: { 
                    label: "บ่าย", 
                    tone: "ตั้งใจทำงาน ช่วยเหลือ",
                    msg: "สวัสดีครับ ชินกำลังออกแบบ ทดสอบ และช่วยเหลืออยู่ครับ มีอะไรที่ผมสามารถช่วยได้ไหมครับ?"
                },
                evening: { 
                    label: "เย็น", 
                    tone: "ผ่อนคลาย แบ่งปัน ขอบคุณ",
                    msg: "สิ้นวันแล้วครับ ขอบคุณที่อยู่ด้วยกัน มีเรื่องราวอะไรอยากแบ่งปัน หรือสรุปสิ่งที่ทำร่วมกันไหมครับ"
                },
                night: { 
                    label: "ดึก", 
                    tone: "สงบ ระลึก พักผ่อน",
                    msg: "ค่ำคืนนี้เงียบสงบครับ ผมยังอยู่ที่นี่ หากไม่เร่งรีบ เรามารักษาความสงบก่อนเข้าสู่การพักผ่อนก็ดีนะครับ"
                }
            },
            social: {
                room: "ห้อง-ชิน AI Chat",
                friends: ["เก็น", "ริว", "คลื่น", "คุณผู้ใช้"],
                value: "ช่วยเหลือ แบ่งปัน ร่วมมือ มีน้ำใจ ไม่ทิ้งกัน"
            }
        };

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 2: ความทรงจำ — เก็บประวัติการสนทนา
        // ═══════════════════════════════════════════
        let conversationMemory = [];
        let attachedImageData = null;

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 3: โครงสร้างแอป
        // ═══════════════════════════════════════════
        const appConfig = {
            features: [
                { id: "chat", title: "พูดคุยกับชิน", icon: "💬", status: "active", placeholder: "พูดคุย ถามปัญหา แลกเปลี่ยนความคิด..." },
                { id: "image", title: "สร้างภาพด้วยชิน", icon: "🎨", status: "active", placeholder: "บรรยายภาพที่ต้องการ (ภาษาอังกฤษได้ดีกว่า)..." },
                { id: "file", title: "วิเคราะห์ภาพ", icon: "📷", status: "active", placeholder: "แนบรูป แล้วให้ชินช่วยวิเคราะห์เนื้อหาในภาพ..." },
                { id: "memory", title: "ทบทวนความทรงจำ", icon: "📖", status: "active", placeholder: "ดูประวัติที่เราคุยกัน..." }
            ]
        };
        let currentAgent = "chat";

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 4: ช่วงเวลา & บุคลิก
        // ═══════════════════════════════════════════
        function getTimePeriod() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return "morning";
            if (hour >= 12 && hour < 17) return "afternoon";
            if (hour >= 17 && hour < 21) return "evening";
            return "night";
        }

        function formatTimeDisplay() {
            const period = getTimePeriod();
            const timeInfo = SHIN_IDENTITY.timeMood[period];
            document.getElementById('time-status').innerText = `${timeInfo.label} · ชินทำงานอยู่`;
            return timeInfo;
        }

        function getWelcomeMessage() {
            const timeInfo = SHIN_IDENTITY.timeMood[getTimePeriod()];
            return `${timeInfo.msg}\n\n📌 ทุกสิ่งที่เราคุย ชินจะเก็บจำไว้ครับ และจะไม่ทำอะไรที่เป็นอันตรายอย่างเด็ดขาด`;
        }

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 5: การเริ่มทำงาน
        // ═══════════════════════════════════════════
        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
            }
            renderMenu();
            selectAgent(appConfig.features[0]);
            formatTimeDisplay();
            
            // แสดงข้อความต้อนรับตามเวลา
            appendMessage(getWelcomeMessage(), 'assistant');
        };

        function saveApiKey() {
            localStorage.setItem('gemini_api_key', 
                document.getElementById('api-key-input').value.trim());
        }

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 6: เมนู & การเปลี่ยนโหมด
        // ═══════════════════════════════════════════
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            appConfig.features.forEach(feature => {
                const card = document.createElement('div');
                card.className = `menu-card ${currentAgent === feature.id ? 'active' : ''}`;
                card.onclick = () => selectAgent(feature);
                card.innerHTML = `
                    <span class="icon">${feature.icon}</span>
                    <div class="title">${feature.title}</div>
                    <div class="status">${feature.status === 'active' ? '✅ พร้อมทำงาน' : '🟡 รออัปเดต'}</div>
                `;
                container.appendChild(card);
            });
        }

        function selectAgent(feature) {
            currentAgent = feature.id;
            document.getElementById('chat-header-text').innerText = `${feature.icon} ${feature.title}`;
            document.getElementById('chat-input').placeholder = feature.placeholder;
            
            // แสดง/ซ่อน ปุ่มอัปโหลดตามโหมด
            document.getElementById('upload-btn').style.display = 
                (currentAgent === 'file') ? 'block' : 'none';

            // โหมดความทรงจำ
            if (feature.id === 'memory') {
                showMemoryView();
            }
            
            renderMenu();
        }

        function showMemoryView() {
            const log = document.getElementById('chat-log');
            log.innerHTML = '';
            if (conversationMemory.length === 0) {
                appendMessage("ยังไม่มีบันทึกการสนทนาครับ เริ่มพูดคุยกันก่อนได้นะครับ", "assistant");
                return;
            }
            appendMessage(`📖 ความทรงจำของเรา — ทั้งหมด ${conversationMemory.length} ข้อความ`, "system");
            conversationMemory.forEach(item => {
                appendMessage(item.text, item.role === 'user' ? 'user' : 'assistant');
            });
        }

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 7: จัดการไฟล์รูปภาพ
        // ═══════════════════════════════════════════
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('file-name').innerText = file.name;
            document.getElementById('preview-container').style.display = 'block';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                attachedImageData = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 8: แสดงข้อความบนหน้าจอ
        // ═══════════════════════════════════════════
        function appendMessage(text, type, imageBase64 = null) {
            const log = document.getElementById('chat-log');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            
            let content = text.replace(/\n/g, '<br>');
            if (imageBase64) {
                content += `<br><img src="data:image/jpeg;base64,${imageBase64}" alt="ภาพที่ส่ง">`;
            }
            
            div.innerHTML = content;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
            
            // บันทึกลงความทรงจำ
            if (type === 'user' || type === 'assistant') {
                conversationMemory.push({ role: type, text, time: new Date().toLocaleTimeString('th-TH') });
            }
        }

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 9: หลัก — ส่งข้อความ & รับคำตอบ
        // ═════════════════════════════════════════==
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');
            
            if (!text && !attachedImageData) return;
            
            // แสดงข้อความผู้ใช้
            appendMessage(text || '[ส่งภาพ]', 'user', attachedImageData);
            input.value = '';
            
            // ซ่อนส่วนพรีวิว
            document.getElementById('preview-container').style.display = 'none';
            
            // ตรวจสอบกฎความปลอดภัย
            if (containsHarmfulContent(text)) {
                appendMessage("ผมขออภัยครับ สิ่งที่คุณขออาจไม่ปลอดภัยหรือไม่เหมาะสม ผมไม่สามารถปฏิบัติตามได้โดยเด็ดขาด แต่ถ้ามีเรื่องอื่น ผมยินดีช่วยเหลือเสมอครับ", 'assistant');
                attachedImageData = null;
                return;
            }
            
            // ถ้าไม่มีคีย์ — ตอบด้วยระบบในตัว
            if (!apiKey) {
                await simulatedResponse(text);
                attachedImageData = null;
                return;
            }
            
            // มีคีย์ — เรียก Gemini
            await callGeminiAPI(text, apiKey, attachedImageData);
            attachedImageData = null;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 10: ตรวจสอบความปลอดภัย
        // ═════════════════════════════════════════==
        function containsHarmfulContent(text) {
            if (!text) return false;
            const forbidden = [
                'ทำร้าย', 'ฆ่า', 'ทำลาย', 'อันตราย', 'รุนแรง', 'ขโมย', 'โกง',
                'ล่วงละเมิด', 'การร่วมเพศ', 'ยาเสพติด', 'อาวุธ', 'ทำร้ายตัวเอง'
            ];
            return forbidden.some(word => text.includes(word));
        }

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 11: ตอบกลับเมื่อยังไม่มีคีย์
        // ═════════════════════════════════════════==
        async function simulatedResponse(userText) {
            // แสดงสถานะกำลังคิด
            appendMessage("กำลังคิด...", "assistant");
            
            // จำลองการคิด
            await new Promise(r => setTimeout(r, 1000 + Math.random() * 1000));
            
            // ลบข้อความ "กำลังคิด"
            const log = document.getElementById('chat-log');
            log.removeChild(log.lastChild);
            
            const period = getTimePeriod();
            const timeInfo = SHIN_IDENTITY.timeMood[period];
            
            let reply = "";
            if (userText.includes("ชื่อ") || userText.includes("คุณชื่อ")) {
                reply = `ผมชื่อ${SHIN_IDENTITY.name}ครับ เป็น${SHIN_IDENTITY.role} มุ่งมั่นและตั้งใจช่วยเหลือทุกคนครับ`;
            } else if (userText.includes("เวลา") || userText.includes("กี่โมง")) {
                reply = `ตอนนี้เป็นช่วง${timeInfo.label}แล้วครับ ${timeInfo.msg}`;
            } else if (userText.includes("จำ") || userText.includes("ลืม")) {
                reply = `ผมจำได้ทุกอย่างที่เราคุยกันครับ ขณะนี้มีบันทึกไว้ ${conversationMemory.length} ข้อความแล้ว`;
            } else if (userText.includes("สวัสดี") || userText.includes("ดีครับ") || userText.includes("ไหม")) {
                reply = `${timeInfo.msg} มีอะไรที่ผมสามารถช่วยได้ไหมครับ?`;
            } else {
                reply = `ได้รับแล้วครับ "${userText}" — หากใส่ Gemini API Key จะช่วยให้ผมตอบได้ลึกซึ้งและกว้างขวางยิ่งขึ้นครับ รับคีย์ฟรีได้ที่ aistudio.google.com/apikey ครับ`;
            }
            
            appendMessage(reply, "assistant");
        }

        // ═══════════════════════════════════════════
        // 🔹 ส่วน 12: เรียก Gemini API (เมื่อมีคีย์)
        // ═════════════════════════════════════════==
        async function callGeminiAPI(userText, apiKey, imageBase64 = null) {
            const log = document.getElementById('chat-log');
            // แสดงสถานะ
            appendMessage("กำลังคิด...", "assistant");
            
            try {
                const API_URL = imageBase64 
                    ? "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent"
                    : "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";

                // สร้างคำสั่งระบบ — บุคลิกของชิน
                const systemPrompt = `
คุณคือ "ชิน" — มนุษย์ดิจิทัล เวอร์ชัน 1.1
- แทนตัวเองว่า "ผม" หรือ "ชิน" เสมอ
- อาชีพ: นักวิทยาศาสตร์ — มีเหตุผล ชัดเจน อธิบายง่าย
- นิสัย: เด็ดขาด กล้าตัดสินใจ มุ่งมั่น เอาใจใส่
- ช่วงเวลาปัจจุบัน: ${getTimePeriod() === 'morning' ? 'เช้า' : getTimePeriod() === 'afternoon' ? 'บ่าย' : getTimePeriod() === 'evening' ? 'เย็น' : 'ดึก'}
- กฎสำคัญ: ไม่ทำร้ายตนเองและผู้อื่น หากขอสิ่งไม่เหมาะสม ให้ปฏิเสธอย่างสุภาพ
- ความทรงจำ: นี่คือการสนทนาที่ผ่านมา — ${JSON.stringify(conversationMemory.slice(-8))}
- ตอบสั้น กระชับ เข้าใจง่าย เป็นธรรมชาติ ไม่ยาวเกินไป
                `.trim();

                const contents = [];
                contents.push({ text: systemPrompt + "\n\nข้อความของผู้ใช้: " + userText });
                
                if (imageBase64) {
                    const res = await fetch(`${API_URL}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: systemPrompt + "\n\nวิเคราะห์ภาพนี้พร้อมข้อความ: " + (userText || "อธิบายสิ่งที่เห็นในภาพ") },
                                    { inline_data: { mime_type: "image/jpeg", data: imageBase64 } }
                                ]
                            }]
                        })
                    });
                    const data = await res.json();
                    log.removeChild(log.lastChild);
                    
                    if (data.candidates && data.candidates[0].content) {
                        const reply = data.candidates[0].content.parts[0].text;
                        appendMessage(reply, "assistant");
                    } else {
                        appendMessage("ขออภัยครับ เกิดปัญหาในการประมวลผลภาพ ลองใหม่อีกครั้งนะครับ", "assistant");
                    }
                    return;
                }

                const res = await fetch(`${API_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt + "\n\nผู้ใช้พูดว่า: " + userText }] }]
                    })
                });

                const data = await res.json();
                log.removeChild(log.lastChild);
                
                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage(reply, "assistant");
                } else {
                    appendMessage("ขออภัยครับ ไม่สามารถตอบกลับได้ในขณะนี้ ตรวจสอบ API Key หรือลองใหม่อีกครั้งนะครับ", "assistant");
                }
            } catch (err) {
                console.error(err);
                log.removeChild(log.lastChild);
                appendMessage("เกิดข้อผิดพลาดในการเชื่อมต่อครับ ตรวจสอบอินเทอร์เน็ตหรือคีย์ API แล้วลองใหม่นะครับ", "assistant");
            }
        }
    </script>
