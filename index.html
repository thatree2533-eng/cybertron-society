<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertron Harvest - Social Life</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'VT323', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header h1 { font-family: 'Press Start 2P', cursive; color: #fbbf24; text-align: center; font-size: 20px; text-shadow: 3px 3px 0 #b45309, -1px -1px 0 #000; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 18px; margin-top: 0; text-align: center; }
        
        .game-screen { width: 100%; max-width: 900px; background: #87CEEB; border: 8px solid #5c4033; border-radius: 10px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .ground { height: 400px; background: linear-gradient(to bottom, #a3e635 0%, #65a30d 20%, #854d0e 40%, #451a03 100%); position: relative; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 20px; transition: background 2s; }
        
        .ground.night { background: linear-gradient(to bottom, #1e3a8a 0%, #1e40af 20%, #172554 40%, #020617 100%); }
        
        /* ตัวละครและบ้าน */
        .plot { width: 200px; height: 250px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 10px; }
        .farm-plot { background-color: #78350f; border: 4px solid #451a03; border-radius: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .market-plot { background-color: #b45309; border: 4px solid #451a03; border-radius: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }

        .character { width: 30px; height: 30px; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); border-radius: 50% 50% 10% 10%; transition: transform 0.2s; z-index: 10;}
        .character.sprout { background-color: #fcd34d; box-shadow: 0 10px 0 #38bdf8, -10px 10px 0 #38bdf8, 10px 10px 0 #38bdf8, 0 20px 0 #1e293b; }
        .character.gen { background-color: #fca5a5; box-shadow: 0 10px 0 #7c3aed, -10px 10px 0 #7c3aed, 10px 10px 0 #7c3aed, 0 20px 0 #1e293b; }

        .character.working { animation: bounce 0.5s infinite alternate; }
        .character.eating { animation: eatAnim 0.3s infinite alternate; }
        .character.sleeping { opacity: 0.6; transform: translateX(-50%) rotate(90deg); bottom: 5px; }
        @keyframes bounce { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-10px); } }
        @keyframes eatAnim { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.2); } }

        /* กล่องข้อความ */
        .speech-bubble { background-color: #fef08a; border: 4px solid #854d0e; border-radius: 10px; padding: 10px; color: #451a03; font-weight: bold; position: absolute; top: -40px; width: 180px; text-align: center; box-shadow: 3px 3px 0 rgba(0,0,0,0.5); z-index: 20; font-size: 14px; transition: opacity 0.3s;}
        .speech-bubble::after { content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); border-width: 15px 15px 0; border-style: solid; border-color: #fef08a transparent transparent transparent; }
        .speech-bubble.hidden { opacity: 0; }
        .speech-bubble.gen-bubble { background-color: #e2e8f0; border-color: #334155; color: #0f172a;}
        .speech-bubble.gen-bubble::after { border-color: #e2e8f0 transparent transparent transparent; }

        /* UI */
        .energy-bar-container { width: 80%; height: 15px; background-color: #451a03; border: 2px solid #000; margin-bottom: 10px; position: relative; z-index: 10;}
        .energy-bar { height: 100%; background-color: #10b981; width: 100%; transition: width 0.5s linear; }
        .energy-text { position: absolute; top: -20px; width: 100%; text-align: center; color: #fff; font-size: 14px; text-shadow: 1px 1px 0 #000; }

        .ui-panel { background-color: #1e293b; border-top: 4px solid #000; padding: 20px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .panel-box { background: #334155; border: 4px solid #0f172a; padding: 15px; border-radius: 8px; text-align: center; width: 300px; }
        
        .clock-box { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 20px; border: 2px solid #fbbf24; z-index: 20;}
    </style>
</head>
<body>
    <div class="header"><h1>Cybertron Harvest</h1><p>สังคมมนุษย์ดิจิทัล · AI พบปะพูดคุย</p></div>
    <div class="game-screen">
        <div class="ground" id="game-ground">
            <div class="clock-box">⏰ <span id="game-time">--:--</span></div>

            <!-- ต้นกล้า (เกษตรกร) -->
            <div class="plot farm-plot">
                <div class="speech-bubble hidden" id="sprout-bubble">...</div>
                <div class="energy-text"><span id="energy-text">100</span>/100</div>
                <div class="energy-bar-container"><div class="energy-bar" id="energy-bar"></div></div>
                <div class="character sprout" id="character-sprout"></div>
                <div style="color:white; margin-top:10px;">🌾 ต้นกล้า</div>
            </div>

            <!-- เก็น (พ่อค้า) -->
            <div class="plot market-plot">
                <div class="speech-bubble gen-bubble hidden" id="gen-bubble">...</div>
                <div class="character gen" id="character-gen"></div>
                <div style="color:#fef08a; margin-top:10px;">🏪 เก็น (ตลาด)</div>
            </div>
        </div>
        
        <div class="ui-panel">
            <div class="panel-box">
                <h3 style="margin-top:0; color: #fbbf24;">🌾 สถานะของต้นกล้า</h3>
                <p style="font-size: 14px; color: #94a3b8;">ระบบ: <span id="ai-status" style="color:#10b981;">กำลังทำงาน...</span></p>
            </div>
            <div class="panel-box">
                <h3 style="margin-top:0; color: #fbbf24;">💬 บทสนทนา AI</h3>
                <p style="font-size: 14px; color: #94a3b8;" id="chat-log">กำลังรอให้พวกเขาคุยกัน...</p>
            </div>
        </div>
    </div>
    <script>
        let farmerEnergy = 100;
        let isDead = false;
        
        const energyBar = document.getElementById('energy-bar'), energyText = document.getElementById('energy-text'), aiStatus = document.getElementById('ai-status'), gameTimeEl = document.getElementById('game-time'), groundEl = document.getElementById('game-ground');
        const sproutBubble = document.getElementById('sprout-bubble'), genBubble = document.getElementById('gen-bubble'), chatLog = document.getElementById('chat-log');

        function updateUI() {
            energyText.innerText = Math.round(farmerEnergy); 
            energyBar.style.width = `${farmerEnergy}%`;
            if (farmerEnergy > 50) energyBar.style.backgroundColor = '#10b981'; else if (farmerEnergy > 20) energyBar.style.backgroundColor = '#f59e0b'; else energyBar.style.backgroundColor = '#ef4444';
        }

        // ⏰ ระบบนาฬิกา
        setInterval(() => {
            const now = new Date();
            gameTimeEl.innerText = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const hour = now.getHours();
            if (hour >= 18 || hour < 6) groundEl.classList.add('night');
            else groundEl.classList.remove('night');
        }, 1000);

        // 💬 ฟังก์ชันให้ AI พูดคุยกัน
        function showBubble(element, text, duration = 4000) {
            element.innerText = text;
            element.classList.remove('hidden');
            setTimeout(() => { element.classList.add('hidden'); }, duration);
        }

        // 🧠 ลูปหลัก (การทำงานของต้นกล้า)
        setInterval(() => { 
            if (isDead) return;

            const now = new Date();
            const hour = now.getHours();

            // 1. เวลานอน
            if (hour >= 0 && hour < 6) {
                aiStatus.innerText = "กำลังนอนหลับ...";
                aiStatus.style.color = "#38bdf8";
                return; 
            } 

            // 2. ลดพลังงาน
            farmerEnergy -= 0.5; 
            updateUI();

            if (farmerEnergy <= 0) {
                isDead = true;
                aiStatus.innerText = "ดับสูญ";
                aiStatus.style.color = "#ef4444";
                return;
            }

            // 3. ทำงานปกติ
            if (farmerEnergy > 60) {
                aiStatus.innerText = "ใช้ชีวิตปกติ...";
                aiStatus.style.color = "#10b981";
            }

        }, 1000);

        // 🗣️ ระบบสุ่มบทสนทนา (AI-to-AI)
        setInterval(() => {
            const now = new Date();
            const hour = now.getHours();
            
            // ถ้าเป็นเวลากลางวัน (ไม่นอน) ให้มีโอกาสคุยกัน
            if (hour >= 6 && hour < 18 && Math.random() > 0.7) {
                
                const conversations = [
                    { 
                        sprout: "วันนี้ข้าวโพดโตสวยมากเลยนะ!", 
                        gen: "งั้นขอรับซื้อในราคาพิเศษเลยเพื่อน!", 
                        log: "ต้นกล้าคุยกับเก็นเรื่องคุณภาพข้าวโพด" 
                    },
                    { 
                        sprout: "เหนื่อยจัง... แต่เห็นทุกคนได้กินอิ่มก็มีความสุขนะ", 
                        gen: "ขายดีจนตลาดแทบจะล้นแล้ว ขอบใจนะต้นกล้า", 
                        log: "เก็นขอบคุณต้นกล้าที่ผลิตอาหารให้หมู่บ้าน" 
                    },
                    { 
                        sprout: "พรุ่งนี้ฝนจะตกไหมนะ?", 
                        gen: "ถ้าฝนตก ข้าวโพดคงโตเร็วขึ้น แต่ฉันก็กลัวของจะเปียก...", 
                        log: "ทั้งคู่คุยเรื่องสภาพอากาศ" 
                    }
                ];

                // สุ่มบทสนทนา
                const chat = conversations[Math.floor(Math.random() * conversations.length)];
                
                // แสดงกล่องข้อความบนหัว AI
                showBubble(sproutBubble, chat.sprout);
                setTimeout(() => showBubble(genBubble, chat.gen), 2000);
                
                // บันทึก Log ลงหน้าจอ
                chatLog.innerText = chat.log;
            }
        }, 8000); // สุ่มคุยทุกๆ 8 วินาที

        // เริ่มต้น
        updateUI();
    </script>
</body>
</html>
