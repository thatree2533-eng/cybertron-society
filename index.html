<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertron - Core System</title>
    <style>
        /* ปรับพื้นหลังให้เรียบง่าย ไม่กินทรัพยากร */
        body { background-color: #050510; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; text-align: center; }
        
        h1 { color: #00d2ff; text-shadow: 0 0 10px #00d2ff; font-size: 24px; margin-bottom: 10px; }
        
        .subtitle { color: #8b949e; font-size: 14px; margin-bottom: 30px; }
        
        /* หน้าต่างสถานะ (แทนพลาสม่าแบบเคลื่อนไหว) */
        .core-panel { width: 100%; max-width: 400px; border: 2px solid #00d2ff; border-radius: 15px; background: rgba(0, 210, 255, 0.05); padding: 20px; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        
        .status-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .status-row:last-child { border-bottom: none; }
        
        .label { color: #8b949e; font-size: 15px; }
        .value { color: #00d2ff; font-weight: bold; font-size: 16px; }
        
        /* ไฟสถานะกระพริบเบาๆ (ไม่กิน CPU) */
        .dot { display: inline-block; width: 10px; height: 10px; background-color: #00ff00; border-radius: 50%; margin-right: 8px; animation: blink 2s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* แถบข้อมูลที่ไหล (ใช้ CSS ล้วน ไม่ใช้ JS) */
        .data-flow { width: 100%; height: 4px; background: linear-gradient(90deg, transparent, #00d2ff, #a855f7, transparent); margin-top: 20px; border-radius: 2px; }
    </style>
</head>
<body>
    <h1>⚡ Plasma Data Core</h1>
    <p class="subtitle">โหมดประหยัดพลังงาน (Lite Mode)</p>

    <div class="core-panel">
        <div class="status-row">
            <span class="label">🔌 INPUT (รับพลังงาน)</span>
            <span class="value"><span class="dot"></span>ONLINE</span>
        </div>
        <div class="status-row">
            <span class="label">💧 STORAGE (สะสมข้อมูล)</span>
            <span class="value">ACTIVE</span>
        </div>
        <div class="status-row">
            <span class="label">💨 OUTPUT (ส่งข้อมูล)</span>
            <span class="value">STREAMING</span>
        </div>
    </div>

    <!-- แถบแสดงการไหลของข้อมูล -->
    <div class="data-flow"></div>
    <p style="color: #555; font-size: 12px; margin-top: 10px;">*ระบบกำลังทำงานเบื้องหลังบน Cloud ไม่กินแบตเตอรี่เครื่องคุณ</p>
</body>
</html>
