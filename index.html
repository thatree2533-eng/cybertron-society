<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertron Village - Map</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'VT323', monospace; height: 100vh; overflow: hidden; }
        
        /* พื้นที่แผนที่เต็มจอ */
        .map-area { width: 100%; height: 100%; position: relative; display: flex; justify-content: center; align-items: center; background: #87CEEB;}
        .map-image { width: 100%; height: 100%; object-fit: cover; }

        /* จุดคลิกเข้าบ้าน */
        .house-node { position: absolute; width: 45px; height: 45px; background: rgba(74, 63, 140, 0.8); border: 3px solid white; border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 20px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: 0.2s; transform: translate(-50%, -50%); z-index: 10;}
        .house-node:hover { transform: translate(-50%, -50%) scale(1.2); background: rgba(74, 63, 140, 1); }

        /* ปุ่มเข้าห้องแชท (ลอยอยู่ด้านล่าง) */
        .chat-btn { position: absolute; bottom: 30px; right: 30px; background: #38bdf8; color: #0f172a; padding: 15px 30px; border-radius: 30px; font-family: 'VT323', monospace; font-size: 24px; font-weight: bold; text-decoration: none; box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); transition: 0.2s; z-index: 20;}
        .chat-btn:hover { background: #7dd3fc; transform: scale(1.05); }

        /* ป้ายชื่อหมู่บ้าน */
        .village-title { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-family: 'Press Start 2P', cursive; font-size: 24px; color: #fbbf24; text-shadow: 3px 3px 0 #b45309, -2px -2px 0 #000; z-index: 20;}
    </style>
</head>
<body>
    <div class="map-area">
        <!-- ⚠️ ใส่ลิงก์รูปแผนที่หมู่บ้านของคุณตรง src ด้านล่างนี้ -->
        <img src="map.jpg" alt="Village Map" class="map-image">
        
        <div class="village-title">Cybertron Village</div>

        <!-- จุดคลิกเข้าบ้านชิน (คุณลากไปวางตำแหน่งบ้านได้เลย) -->
        <div class="house-node" style="top: 20%; left: 80%;" onclick="alert('เข้าสู่บ้านชิน!')" title="บ้านชิน">ช</div>
        <!-- เพิ่มบ้านอื่นๆ ต่อได้ที่นี่ -->
        <div class="house-node" style="top: 30%; left: 15%;" onclick="alert('เข้าสู่บ้านมีน่า!')" title="บ้านมีน่า">ม</div>

        <!-- ปุ่มลอยเข้าห้องแชทรวม -->
        <a href="chat.html" class="chat-btn">💬 เข้าห้องรวม-0001</a>
    </div>
</body>
</html>
