<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกาะ 3D ของเรา</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #87CEEB 0%, #4FB5E8 60%, #1E90FF 100%);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        .scene {
            perspective: 1000px;
        }

        .island-3d {
            width: 300px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-20px) rotateY(5deg); }
            100% { transform: translateY(0px) rotateY(0deg); }
        }

        .island-top {
            position: absolute;
            width: 300px;
            height: 160px;
            background: linear-gradient(180deg, #7CCD7C 0%, #5A9A5A 100%);
            border-radius: 50%;
            top: 20px;
            left: 0;
            box-shadow: inset 0 -10px 20px rgba(0,60,30,0.3);
        }

        .island-front {
            position: absolute;
            width: 300px;
            height: 80px;
            background: linear-gradient(180deg, #8B5A2B 0%, #5D3A1A 100%);
            top: 100px;
            left: 0;
            border-radius: 0 0 50% 50%;
            transform: rotateX(-60deg);
            transform-origin: top;
        }

        .tree {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .tree-trunk {
            width: 12px;
            height: 40px;
            background: #8B4513;
            margin: 0 auto;
        }

        .tree-leaves {
            width: 60px;
            height: 60px;
            background: #228B22;
            border-radius: 50%;
            position: relative;
            top: -10px;
        }

        .water {
            position: absolute;
            width: 320px;
            height: 50px;
            background: linear-gradient(90deg, rgba(30,144,255,0.6), rgba(0,102,204,0.6));
            border-radius: 50%;
            top: 130px;
            left: -10px;
            z-index: -1;
            animation: wave 3s ease-in-out infinite;
        }

        @keyframes wave {
            0% { transform: translateX(0px); }
            50% { transform: translateX(10px); }
            100% { transform: translateX(0px); }
        }

        .text {
            margin-top: 2rem;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .text h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .text p {
            font-size: 1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="island-3d">
            <div class="island-top"></div>
            <div class="island-front"></div>
            <div class="tree">
                <div class="tree-leaves"></div>
                <div class="tree-trunk"></div>
            </div>
            <div class="water"></div>
        </div>

        <div class="text">
            <h1>🏝️ เกาะ 3D ของเรา</h1>
            <p>เกาะเล็กๆ ที่กำลังลอยอยู่ในทะเลแห่งจินตนาการ</p>
        </div>
    </div>

</body>
</html>
