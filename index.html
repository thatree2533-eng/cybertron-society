<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกาะ 3D - สังคมมนุษย์ดิจิทัล</title>
    <style> 
        body { margin: 0; overflow: hidden; background: linear-gradient(to bottom, #87CEEB, #1E90FF); } 
        #info { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; font-family: sans-serif; text-shadow: 1px 1px 5px black; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="info">
        <h2>🌴 เกาะ 3D ของเรา</h2>
        <p>สมาชิก AI กำลังรวมตัวกันที่ประตูมิติ</p>
    </div>

    <script>
        // 1. ตั้งค่าฉากและกล้อง
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 25);
        camera.lookAt(0, 0, 0);

        // 2. Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 3. แสง
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 4. เกาะและหญ้า
        const islandGeo = new THREE.ConeGeometry(8, 5, 32);
        const islandMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50 }); 
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.rotation.x = Math.PI; 
        island.position.y = -2;
        scene.add(island);

        const grassGeo = new THREE.CylinderGeometry(8, 8, 1, 32);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x66BB6A });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.position.y = 0.5;
        scene.add(grass);

        // 5. ต้นไม้
        function createTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3, 8), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
            trunk.position.set(x, 2, z);
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshStandardMaterial({ color: 0x2E8B57 }));
            leaves.position.set(x, 4, z);
            scene.add(trunk, leaves);
        }
        createTree(-4, -3);
        createTree(4, -2);
        createTree(-3, 4);
        createTree(5, 3);

        // 6. Portal
        const portalGeo = new THREE.TorusGeometry(1.5, 0.3, 16, 100);
        const portalMat = new THREE.MeshStandardMaterial({ color: 0x00FFFF, emissive: 0x00FFFF });
        const portal = new THREE.Mesh(portalGeo, portalMat);
        portal.position.set(0, 3, 0);
        portal.rotation.x = Math.PI / 2;
        scene.add(portal);

        // 7. สร้างตัวละคร AI (ร่างจำลอง)
        function createAI(x, z, color, name) {
            // ลำตัว
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.set(x, 2, z);
            
            // หัว
            const headGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(x, 3.5, z);

            scene.add(body, head);
        }

        // วางตำแหน่ง AI ทั้ง 4 คนรอบๆ Portal
        createAI(-3, 0, 0xff0000, "เก็น");   // สีแดง (ศิลปิน)
        createAI(3, 0, 0x00ff00, "ชิน");    // สีเขียว (นักวิทยาศาสตร์)
        createAI(0, -3, 0x0000ff, "ริว");   // สีน้ำเงิน (โปรแกรมเมอร์)
        createAI(0, 3, 0x00ffff, "คลื่น");  // สีฟ้า (ที่ปรึกษา)

        // 8. แอนิเมชัน
        function animate() {
            requestAnimationFrame(animate);
            portal.rotation.z += 0.02; // Portal หมุน
            island.rotation.y += 0.002; // เกาะหมุนช้าๆ
            
            // ให้ AI ลอยขึ้นลงเล็กน้อย (จำลองการหายใจ)
            scene.children.forEach(child => {
                if (child.geometry && child.geometry.type === 'CylinderGeometry' && child.position.y > 1) {
                     child.position.y = 2 + Math.sin(Date.now() * 0.002 + child.position.x) * 0.1;
                }
            });

            renderer.render(scene, camera);
        }

        // ปรับขนาดหน้าจอ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
