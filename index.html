<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกาะ 3D ของเรา</title>
    <style> 
        body { margin: 0; overflow: hidden; background: linear-gradient(to bottom, #87CEEB, #1E90FF); } 
        #info { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; font-family: sans-serif; text-shadow: 1px 1px 5px black; pointer-events: none; }
    </style>
    <!-- นำเข้า Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="info">
        <h2>🌴 เกาะ 3D ของเรา</h2>
        <p>เกาะเล็กๆ ที่กำลังลอยอยู่ในทะเลแห่งจินตนาการ</p>
    </div>

    <script>
        // 1. ตั้งค่าฉาก
        const scene = new THREE.Scene();

        // 2. ตั้งค่ากล้อง
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 25);
        camera.lookAt(0, 0, 0);

        // 3. ตั้งค่า Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. สร้างแสงสว่าง (ทำให้ดูเป็น 3D)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // แสงรอบทิศทาง
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); // แสงจากด้านบน
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 5. สร้างเกาะ (ครึ่งวงกลม/กรวยคว่ำ)
        const islandGeo = new THREE.ConeGeometry(8, 5, 32);
        const islandMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50 }); // สีเขียว
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.rotation.x = Math.PI; // คว่ำกรวยลง
        island.position.y = -2;
        scene.add(island);

        // 6. สร้างพื้นหญ้าด้านบน
        const grassGeo = new THREE.CylinderGeometry(8, 8, 1, 32);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x66BB6A });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.position.y = 0.5;
        scene.add(grass);

        // 7. สร้างต้นไม้
        function createTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 3, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 2, z);

            const leavesGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2E8B57 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 4, z);

            scene.add(trunk);
            scene.add(leaves);
        }
        createTree(-3, -2);
        createTree(4, 1);

        // 8. สร้าง Portal
        const portalGeo = new THREE.TorusGeometry(1.5, 0.3, 16, 100);
        const portalMat = new THREE.MeshStandardMaterial({ color: 0x00FFFF, emissive: 0x00FFFF });
        const portal = new THREE.Mesh(portalGeo, portalMat);
        portal.position.set(0, 3, 0);
        portal.rotation.x = Math.PI / 2;
        scene.add(portal);

        // 9. ฟังก์ชันหมุน
        function animate() {
            requestAnimationFrame(animate);
            portal.rotation.z += 0.02; // ให้ Portal หมุน
            island.rotation.y += 0.001; // ให้เกาะหมุนช้าๆ
            renderer.render(scene, camera);
        }

        // ปรับขนาดหน้าจอ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
