<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybertron V7 - แชทหายงงแล้ว</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020617;color:#e2e8f0;font-family:'Kanit',sans-serif;height:100vh;display:flex;flex-direction:column}
.header{padding:14px 16px;background:#020617;border-bottom:2px solid #1e293b;text-align:center}
.header b{color:#38bdf8;font-size:18px}
.header small{display:block;color:#64748b;font-size:11px;margin-top:4px}
.log{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:16px;max-width:80%;font-size:14px;line-height:1.6}
.msg.user{background:#0284c7;align-self:flex-end;color:#fff;border-bottom-right-radius:4px}
.msg.system{background:#1e293b;border:1px dashed #334155;align-self:center;color:#94a3b8;font-size:12px;text-align:center}
.msg.ai{align-self:flex-start;background:#1e293b;border-left:5px solid}
.msg.shin{border-color:#000000} .msg.gen{border-color:#9ca3af} .msg.ryu{border-color:#ffffff} .msg.kluen{border-color:#38bdf8}
.name{font-weight:600;font-size:12px;margin-bottom:4px;display:block}
.input{padding:12px;background:#0f172a;border-top:2px solid #1e293b;display:flex;gap:8px}
.input input{flex:1;padding:10px 14px;background:#020617;border:1px solid #334155;color:#fff;border-radius:20px;outline:none;font-size:14px}
.input button{padding:10px 18px;background:#38bdf8;border:none;border-radius:20px;font-weight:600;cursor:pointer}
.help{display:flex;gap:6px;padding:8px 12px;background:#0f172a;overflow-x:auto}
.help button{padding:6px 10px;border-radius:16px;background:#1e293b;border:1px solid #334155;color:#cbd5e1;font-size:11px;cursor:pointer;white-space:nowrap}
.help button.shin{border-color:#000} .help button.gen{border-color:#9ca3af} .help button.ryu{border-color:#fff} .help button.kluen{border-color:#38bdf8}
</style>
</head>
<body>
<div class="header">
<b>💬 ห้องรวม-0001 V7 - หายงงแล้ว</b>
<small>⚫ชิน ดำ เด็ดขาด | ⬜เก็น เทา ยุติธรรม | ⚪ริว ขาว มีจริยธรรม | 🔵คลื่น ฟ้า ใจดี • พิมพ์ชื่อแล้วคนนั้นจะตอบคนเดียว</small>
</div>
<div class="log" id="log"></div>
<div class="help">
<button class="shin" onclick="q('ชิน สวัสดี')">⚫ ถามชิน</button>
<button class="gen" onclick="q('เก็น สวัสดี')">⬜ ถามเก็น</button>
<button class="ryu" onclick="q('ริว สวัสดี')">⚪ ถามริว</button>
<button class="kluen" onclick="q('คลื่น สวัสดี')">🔵 ถามคลื่น</button>
<button onclick="q('สวัสดี')">ไม่ระบุชื่อ</button>
</div>
<div class="input"><input id="inp" placeholder="พิมพ์ชื่อก่อน เช่น ชินทำอะไรอยู่"><button onclick="send()">ส่ง</button></div>

<script>
const log=document.getElementById('log'), inp=document.getElementById('inp');
let count={ชิน:0,เก็น:0,ริว:0,คลื่น:0};

const AI={
"ชิน":{
 c:"shin", full:"⚫ ชิน [ดำ] นักวิทยาศาสตร์ - เด็ดขาด กล้าตัดสินใจ",
 replies:[
  "สวัสดีครับ ผมชิน สีดำ นักวิทยาศาสตร์ นิสัยเด็ดขาด กล้าตัดสินใจครับ มีอะไรให้ผมตัดสินใจให้ไม?",
  "ผมกำลังวิเคราะห์ผลทดลองอยู่ครับ ถ้าข้อมูลชัด ผมตัดสินใจทันที ไม่ลังเลครับ นี่คือนิสัยผม",
  "เรื่องสีดำของผม มันคือความชัดเจน ตรงไปตรงมา ไม่คลุมเครือครับ"
 ]
},
"เก็น":{
 c:"gen", full:"⬜ เก็น [เทา] ศิลปะ 3D - ยุติธรรม มีเหตุผล",
 replies:[
  "สวัสดีครับ ผมเก็น สีเทา ศิลปะ 3D นิสัยยุติธรรม มีเหตุผลครับ",
  "งาน 3D ของผมต้องใช้เหตุผลครับ แสงเงาต้องยุติธรรมกับทุกวัตถุ ไม่เอนเอียง",
  "สีเทาของผมอยู่ตรงกลางระหว่างขาวกับดำครับ คือความสมดุล ไม่สุดโต่ง"
 ]
},
"ริว":{
 c:"ryu", full:"⚪ ริว [ขาว] โปรแกรมเมอร์ - ความถูกต้อง มีจริยธรรม",
 replies:[
  "สวัสดีครับ ผมริว สีขาว โปรแกรมเมอร์ ยึดความถูกต้อง มีจริยธรรมครับ",
  "ผมกำลังเช็คโค้ดไม่ให้ลูปแบบที่เคยเป็นครับ โค้ดต้องขาวสะอาด ถูกต้อง 100%",
  "สีขาวของผมคือโค้ดที่ไม่มีอะไรแอบแฝงครับ ถูกต้องและมีจริยธรรม"
 ]
},
"คลื่น":{
 c:"kluen", full:"🔵 คลื่น [ฟ้า] ที่ปรึกษา - สงบ ใจดี",
 replies:[
  "สวัสดีครับ ผมคลื่น สีฟ้า ที่ปรึกษา นิสัยสงบ ใจดีครับ มีอะไรให้ช่วยปรึกษาไมครับ?",
  "ถ้าคุยแล้วงงๆ ใจเย็นๆ นะครับ ค่อยๆ พิมพ์ชื่อคนที่อยากคุย เช่น พิมพ์ว่า ชิน ครับ",
  "ผมชงชาฟ้าๆ ไว้แล้วครับ มานั่งพักแล้วคุยกันแบบไม่รีบนะครับ"
 ]
}
};

function add(text, cls, name){
 const d=document.createElement('div'); d.className='msg '+cls;
 d.innerHTML=(name?`<span class="name">${name}</span>`:'')+text;
 log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function q(t){inp.value=t; send();}

function send(){
 let txt=inp.value.trim(); if(!txt) return;
 add(txt,'user'); inp.value='';

 // กฎหายงง: หาแค่คนเดียวที่ถูกเรียก
 let target=null;
 for(let k in AI){ if(txt.includes(k)){ target=k; break; } }

 if(target){
  // มีชื่อ -> คนนั้นตอบคนเดียว
  const data=AI[target];
  const idx=count[target] % data.replies.length;
  const reply=data.replies[idx];
  count[target]++;
  setTimeout(()=>{ add(reply,'ai '+data.c, data.full); },400);
 } else {
  // ไม่มีชื่อ -> คลื่นตอบคนเดียว ไม่ให้ตอบพร้อมกัน 2 คนแล้วงง
  const data=AI["คลื่น"];
  const reply=`คุณพิมพ์ว่า "${txt}" ครับ ถ้าอยากคุยกับใคร ให้พิมพ์ชื่อนำหน้าเลยนะครับ เช่น "ชินทำอะไรอยู่" "เก็นสีอะไรสวย" "ริวช่วยเขียนโค้ด" ผมคลื่นจะได้ไม่ต้องตอบคนเดียวแบบงงๆ ครับ`;
  setTimeout(()=>{ add(reply,'ai '+data.c, data.full+' • แนะนำ'); },400);
 }
}

// เริ่ม
add(`ยินดีต้อนรับครับครูบาก้วย! V7 แบบหายงงแล้ว<br><br>
<b>วิธีคุยไม่ให้งง:</b><br>
• พิมพ์ <b>ชิน</b> → ชินตอบคนเดียว<br>
• พิมพ์ <b>เก็น</b> → เก็นตอบคนเดียว<br>
• พิมพ์ <b>ริว</b> → ริวตอบคนเดียว<br>
• พิมพ์ <b>คลื่น</b> → คลื่นตอบคนเดียว<br>
• ไม่พิมพ์ชื่อ → คลื่นจะแนะนำวิธีคุย<br><br>
ลองกดปุ่มด้านล่างดูครับ จะเห็นว่าคนเดียวตอบ ไม่ซ้ำ ไม่ลูปแล้วครับ`,'system');
</script>
</body>
</html>
