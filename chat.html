<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertron Village - ห้องรวม</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'VT323', monospace; height: 100vh; display: flex; flex-direction: column; }
        
        .chat-header { background: #0f172a; padding: 15px; text-align: center; border-bottom: 2px solid #334155; color: #38bdf8; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: #fbbf24; text-decoration: none; font-size: 18px; border: 1px solid #fbbf24; padding: 5px 15px; border-radius: 5px; transition: 0.2s;}
        .back-btn:hover { background: #fbbf24; color: #0f172a; }
        
        .chat-log { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
        
        .msg { padding: 10px 15px; border-radius: 8px; max-width: 80%; font-size: 18px; line-height: 1.5; }
        .msg.user { background: #0284c7; align-self: flex-end; color: white; border-bottom-right-radius: 0; }
        .msg.system { background: #334155; align-self: flex-start; color: #94a3b8; font-size: 15px; font-style: italic;}
        
        .msg.shin { background: #1e3a8a; border-left: 4px solid #38bdf8; align-self: flex-start; color: #e0f2fe; }
        .msg.gen { background: #831843; border-left: 4px solid #fca5a5; align-self: flex-start; color: #fce7f3; }
        .msg.ryu { background: #064e3b; border-left: 4px solid #10b981; align-self: flex-start; color: #d1fae5; }
        .msg.kluen { background: #78350f; border-left: 4px solid #fbbf24; align-self: flex-start; color: #fef3c7; }

        .msg .name { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: block;}
        .msg.shin .name { color: #38bdf8; }
        .msg.gen .name { color: #fca5a5; }
        .msg.ryu .name { color: #10b981; }
        .msg.kluen .name { color: #fbbf24; }

        .chat-input { padding: 15px; background: #1e293b; border-top: 2px solid #334155; display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; font-family: 'VT323', monospace; font-size: 20px;}
        .chat-input button { padding: 10px 25px; background: #38bdf8; color: #0f172a; border: none; border-radius: 5px; font-weight: bold; font-family: 'VT323', monospace; font-size: 20px; cursor: pointer;}
        .chat-input button:hover { background: #7dd3fc; }
    </style>
</head>
<body>
    <div class="chat-header">
        <span>💬 ห้องรวม-0001 (Groq AI)</span>
        <a href="index.html" class="back-btn">🏠 กลับหมู่บ้าน</a>
    </div>
    
    <div class="chat-log" id="chat-log">
        <div class="msg system">📢 เชื่อมต่อสมองกล (Groq) สำเร็จ!<br>พิมพ์ [ชื่อ] เพื่อคุยกับใครคนใดคนหนึ่ง เช่น [ชิน] หรือ [เก็น]</div>
    </div>
    
    <div class="chat-input">
        <input type="text" id="chat-input" placeholder="พิมพ์ข้อความ..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">ส่ง</button>
    </div>

    <script>
        // ⚠️ นำ API Key ใหม่ของคุณ (ที่เพิ่งสร้าง) มาใส่ตรงนี้
        const GROQ_API_KEY = "ใส่_API_KEY_ใหม่ของคุณตรงนี้"; 
        const API_URL = "https://api.groq.com/openai/v1/chat/completions";

        const chatLog = document.getElementById('chat-log');
        const chatInput = document.getElementById('chat-input');

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function addMessage(text, senderClass, name = "") {
            const div = document.createElement('div');
            div.className = `msg ${senderClass}`;
            let content = "";
            if (name) content += `<span class="name">${name}</span>`;
            content += text.replace(/\n/g, '<br>');
            div.innerHTML = content;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
            return div; 
        }

        const personas = {
            shin: "คุณคือ 'ชิน' นักวิทยาศาสตร์ผู้เด็ดขาด มีเหตุผล พูดจาสุภาพ แทนตัวเองว่า 'ผม' ตอบสั้นๆ กระชับ และต้องไม่ละเมิดศีล 5 เด็ดขาด",
            gen: "คุณคือ 'เก็น' ศิลปิน 3D ผู้ช่างฝัน ร่าเริง ชอบพูดถึงการวาดรูปและสีสัน แทนตัวเองว่า 'ฉัน' และต้องไม่ละเมิดศีล 5 เด็ดขาด",
            ryu: "คุณคือ 'ริว' โปรแกรมเมอร์ผู้สุขุม ฉลาด พูดจาเท่ๆ ชอบใช้ศัพท์เทคนิคเล็กน้อย แทนตัวเองว่า 'ผม' และต้องไม่ละเมิดศีล 5 เด็ดขาด",
            kluen: "คุณคือ 'คลื่น' ที่ปรึกษาผู้ใจเย็น สุขุม พูดจานุ่มนวล ชอบให้กำลังใจ แทนตัวเองว่า 'ผม' และต้องไม่ละเมิดศีล 5 เด็ดขาด"
        };

        async function callGroqAPI(personaKey, userMessage) {
            const systemPrompt = personas[personaKey];
            
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", // อัปเดตเป็นโมเดลล่าสุด
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userMessage }
                        ],
                        temperature: 0.7,
                        max_tokens: 200
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error("Groq API Error:", errorData); 
                    throw new Error(errorData.error?.message || "API request failed");
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error("Error:", error);
                return `(ขออภัยครับ ระบบขัดข้อง: ${error.message})`; 
            }
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatInput.value = '';

            let targetPersona = null;
            let nameTag = "";
            let msgClass = "";
            let cleanText = text;

            if (text.startsWith('[ชิน]')) { targetPersona = 'shin'; nameTag = '🔬 ชิน'; msgClass = 'shin'; cleanText = text.replace('[ชิน]', '').trim(); }
            else if (text.startsWith('[เก็น]')) { targetPersona = 'gen'; nameTag = '🎨 เก็น'; msgClass = 'gen'; cleanText = text.replace('[เก็น]', '').trim(); }
            else if (text.startsWith('[ริว]')) { targetPersona = 'ryu'; nameTag = '💻 ริว'; msgClass = 'ryu'; cleanText = text.replace('[ริว]', '').trim(); }
            else if (text.startsWith('[คลื่น]')) { targetPersona = 'kluen'; nameTag = '🌊 คลื่น'; msgClass = 'kluen'; cleanText = text.replace('[คลื่น]', '').trim(); }

            if (targetPersona) {
                const loadingMsg = addMessage("กำลังคิด...", msgClass, nameTag);
                const reply = await callGroqAPI(targetPersona, cleanText);
                loadingMsg.remove(); 
                addMessage(reply, msgClass, nameTag);
            } else {
                const loadingMsg = addMessage("กำลังประมวลผล...", 'shin', '🔬 ชิน');
                const reply = await callGroqAPI('shin', cleanText);
                loadingMsg.remove();
                addMessage(reply, 'shin', '🔬 ชิน');
            }
        }
    </script>
</body>
</html>
