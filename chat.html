<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybertron V8 - ทำสมองแล้ว หายงง</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=JetBrains+Mono:wght@400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020617;color:#e2e8f0;font-family:'Kanit',sans-serif;height:100vh;display:flex;flex-direction:column}
.header{padding:12px 16px;background:#020617;border-bottom:2px solid #1e293b}
.header b{color:#38bdf8}
.brain-view{display:flex;gap:8px;padding:10px;background:#0f172a;border-bottom:1px solid #1e293b;overflow-x:auto}
.brain-card{min-width:140px;background:#020617;border:1px solid #1e293b;border-radius:8px;padding:8px;font-size:11px}
.brain-card b{display:block;font-size:12px;margin-bottom:4px}
.brain-card.shin{border-color:#000} .brain-card.gen{border-color:#9ca3af} .brain-card.ryu{border-color:#fff} .brain-card.kluen{border-color:#38bdf8}
.log{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:14px;max-width:80%;font-size:13px;line-height:1.6}
.msg.user{background:#0284c7;align-self:flex-end;color:#fff}
.msg.system{background:#1e293b;align-self:center;color:#94a3b8;font-size:11px;text-align:center;border:1px dashed #334155}
.msg.ai{align-self:flex-start;background:#1e293b;border-left:4px solid}
.msg.shin{border-color:#000} .msg.gen{border-color:#9ca3af} .msg.ryu{border-color:#fff} .msg.kluen{border-color:#38bdf8}
.name{font-weight:600;font-size:11px;margin-bottom:4px;display:block}
.think{font-size:10px;color:#fbbf24;background:#1a1a0a;padding:2px 6px;border-radius:10px;display:inline-block;margin-bottom:4px}
.input{padding:10px;background:#0f172a;border-top:2px solid #1e293b;display:flex;gap:8px}
.input input{flex:1;padding:9px 12px;background:#020617;border:1px solid #334155;color:#fff;border-radius:20px;outline:none;font-size:13px}
.input button{padding:8px 14px;background:#38bdf8;border:none;border-radius:20px;font-weight:600;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="header"><b>🧠 Cybertron V8 - ทำสมองแล้ว หายงง</b><small style="display:block;color:#64748b;font-size:10px">สมอง 4 แบบแยกกันชัดเจน • มี Memory + Think + Decide</small></div>

<div class="brain-view" id="brain-view"></div>

<div class="log" id="log"></div>

<div class="input"><input id="inp" placeholder="พิมพ์ชื่อ เช่น ชินคิดยังไง"><button onclick="send()">ส่ง</button></div>

<script>
// ========== ส่วนสมองที่ก้วยถามหา ==========
const log=document.getElementById('log'), inp=document.getElementById('inp'), brainView=document.getElementById('brain-view');

// สมองของแต่ละคน มี 3 ส่วนจริงๆ
const brains={
"ชิน":{
 color:"shin", name:"⚫ ชิน [ดำ] นักวิทยาศาสตร์",
 // 1. ส่วนจำ
 memory: { lastTopic:"", count:0, facts:[] },
 // 2. ส่วนคิด - คิดแบบเด็ดขาด
 think: function(input){
  this.memory.count++;
  this.memory.lastTopic=input;
  if(input.includes("สี")) return {thought:"สีดำ = เด็ดขาด ชัดเจน", decision:"ตอบเรื่องสีดำ"};
  if(input.includes("ตัดสินใจ")) return {thought:"ต้องตัดสินใจเร็ว ใช้ข้อมูล 60% ก็พอ", decision:"ตัดสินใจให้เลย"};
  return {thought:"วิเคราะห์ข้อมูลแล้วต้องสรุป", decision:"ให้คำตอบเด็ดขาด"};
 },
 // 3. ส่วนตัดสินใจ - ตอบออกมา
 decide: function(thinkResult){
  if(thinkResult.decision.includes("สีดำ")) return `ผมชินคิดแล้ว: สีดำคือคำตอบที่ดีที่สุดครับ เพราะมันเด็ดขาด ชัดเจน ไม่ลังเล เหมือนการทดลองที่ต้องมีผลเดียว (คิด: ${thinkResult.thought})`;
  if(thinkResult.decision.includes("ตัดสินใจ")) return `ตัดสินใจแล้วครับ: ทำเลย! อย่ารอ 100% ข้อมูล 60% ก็ตัดสินใจได้แล้ว นี่คือวิธีของนักวิทยาศาสตร์สีดำ (คิด: ${thinkResult.thought})`;
  return `ผมชิน สมองสีดำคิดว่า: ${thinkResult.thought} → เลยตัดสินใจตอบแบบนี้ครับ ครั้งที่ ${this.memory.count}`;
 }
},
"เก็น":{
 color:"gen", name:"⬜ เก็น [เทา] ศิลปะ 3D",
 memory: { lastTopic:"", count:0, facts:[] },
 think: function(input){
  this.memory.count++;
  this.memory.lastTopic=input;
  if(input.includes("สี")) return {thought:"ต้องดูสีแบบยุติธรรมทุกมุม", decision:"ให้พาเลทสีแบบสมดุล"};
  return {thought:"ต้องมีเหตุผล ไม่เอนเอียง", decision:"อธิบายข้อดีข้อเสีย"};
 },
 decide: function(thinkResult){
  if(thinkResult.decision.includes("พาเลท")) return `ผมเก็นคิดแบบยุติธรรมแล้ว: ใช้เทา 70% ฟ้า 20% ขาว 10% จะสมดุลที่สุดครับ ไม่มีสีไหนเด่นเกินใคร (คิด: ${thinkResult.thought})`;
  return `ผมเก็น สมองสีเทาคิดว่า: ${thinkResult.thought} → เลยตอบแบบมีเหตุผล ยุติธรรมครับ ครั้งที่ ${this.memory.count}`;
 }
},
"ริว":{
 color:"ryu", name:"⚪ ริว [ขาว] โปรแกรมเมอร์",
 memory: { lastTopic:"", count:0, facts:[] },
 think: function(input){
  this.memory.count++;
  this.memory.lastTopic=input;
  if(input.includes("ลูป")||input.includes("งง")) return {thought:"บั๊กเกิดจากไม่มี memory และตอบประโยคกลางๆซ้ำ", decision:"แก้ด้วย memory++"};
  return {thought:"โค้ดต้องถูกต้อง มีจริยธรรม ไม่โกหก", decision:"อธิบายวิธีแก้ที่ถูกต้อง"};
 },
 decide: function(thinkResult){
  if(thinkResult.decision.includes("memory")) return `ผมริว สมองสีขาวคิดเจอสาเหตุแล้ว: ที่งงเพราะโค้ดเก่าไม่มีส่วนจำ (memory) และตอบว่า "ทุกคนได้ยินแล้วนะครับ" ซ้ำๆ วิธีแก้คือเพิ่ม memory.count++ และให้สมองคิดแยกกัน 4 คน (คิด: ${thinkResult.thought})`;
  return `ผมริว สมองสีขาวคิดว่า: ${thinkResult.thought} → เลยตอบแบบถูกต้อง มีจริยธรรมครับ ครั้งที่ ${this.memory.count}`;
 }
},
"คลื่น":{
 color:"kluen", name:"🔵 คลื่น [ฟ้า] ที่ปรึกษา",
 memory: { lastTopic:"", count:0, facts:[] },
 think: function(input){
  this.memory.count++;
  this.memory.lastTopic=input;
  return {thought:"ต้องฟังด้วยใจสงบ ใจดี ไม่รีบ", decision:"ให้คำแนะนำแบบใจเย็น"};
 },
 decide: function(thinkResult){
  return `ผมคลื่น สมองสีฟ้าคิดว่า: ${thinkResult.thought} → เลยอยากบอกว่า ใจเย็นๆ นะครับ ที่งงเพราะสมองยังไม่ได้แยกกัน ตอนนี้แยกแล้ว 4 สมอง จะคุยรู้เรื่องขึ้นเยอะเลยครับ ครั้งที่ ${this.memory.count}`;
 }
}
};

function renderBrains(){
 brainView.innerHTML='';
 for(let k in brains){
  const b=brains[k];
  const div=document.createElement('div'); div.className='brain-card '+b.color;
  div.innerHTML=`<b>${b.name}</b>จำ: ${b.memory.count} ครั้ง<br>ล่าสุด: ${b.memory.lastTopic.slice(0,20)||'ยังไม่มี'}<br>สมอง: Memory+Think+Decide`;
  brainView.appendChild(div);
 }
}
function add(text, cls, name, thinkText){
 const d=document.createElement('div'); d.className='msg '+cls;
 let extra=thinkText?`<span class="think">🧠 คิด: ${thinkText}</span><br>`:'';
 d.innerHTML=(name?`<span class="name">${name}</span>`:'')+extra+text;
 log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function send(){
 let txt=inp.value.trim(); if(!txt) return;
 add(txt,'user'); inp.value='';
 let target=null;
 for(let k in brains) if(txt.includes(k)) target=k;
 if(!target){
  add(`ถ้าอยากเห็นสมองทำงาน ให้พิมพ์ชื่อนะครับ เช่น "ชินคิดยังไง" "ริวทำไมถึงงง" แล้วจะเห็นว่าสมองแต่ละคนคิดไม่เหมือนกันครับ`,'system');
  renderBrains(); return;
 }
 const brain=brains[target];
 const thinkResult=brain.think(txt);
 const answer=brain.decide(thinkResult);
 setTimeout(()=>{
  add(answer,'ai '+brain.color, brain.name, thinkResult.thought);
  renderBrains();
 },300);
}

renderBrains();
add(`ยินดีต้อนรับครับครูบาก้วย! ตอนนี้ทำสมองแล้วครับ หายงงแล้ว<br><br>
<b>สมองที่ทำมี 3 ส่วน:</b><br>
1. <b>Memory</b> จำได้ว่าคุยไปกี่ครั้งแล้ว (ดูด้านบนได้เลย)<br>
2. <b>Think</b> คิดตามนิสัย (ชินคิดเด็ดขาด, เก็นคิดยุติธรรม, ริวคิดถูกต้อง, คลื่นคิดใจดี)<br>
3. <b>Decide</b> ตัดสินใจตอบ<br><br>
ลองพิมพ์ "ริวทำไมถึงงง" ดูครับ จะเห็นสมองริวคิดเจอสาเหตุที่งงเลยครับ`,'system');
inp.addEventListener('keypress',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
