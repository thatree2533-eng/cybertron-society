<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หมู่บ้านสังคมเอไอ — ห้องรวม</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg-dark: #020617;
 --bg-card: #0f172a;
 --bg-ai: #1e293b;
 --border: #334155;
 --text: #e2e8f0;
 --text-muted: #94a3b8;
 --shin: #000000; --shin-text: #ffffff;
 --gen: #9ca3af; --gen-text: #ffffff;
 --ryu: #ffffff; --ryu-text: #000000;
 --kluen: #38bdf8; --kluen-text: #000000;
 --mina: #84cc16; --mina-text: #000000;
 --feya: #f59e0b; --feya-text: #000000;
 --kanya: #6366f1; --kanya-text: #ffffff;
 --deer: #a855f7; --deer-text: #ffffff;
 --user: #0284c7;
 --system: #475569;
}
body{background:var(--bg-dark);color:var(--text);font-family:'Kanit',sans-serif;height:100vh;display:flex;flex-direction:column}
.header{padding:14px 20px;background:var(--bg-card);border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:1.2rem}
.header .status{display:flex;gap:10px;font-size:0.8rem}
.status span{padding:3px 8px;border-radius:12px}
.log{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;background:var(--bg-dark)}
.msg{padding:14px 18px;border-radius:14px;max-width:85%;font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.msg.user{background:var(--user);align-self:flex-end;color:#fff}
.msg.system{background:var(--system);align-self:center;color:#fff;text-align:center;max-width:70%}
.msg.ai{align-self:flex-start;border-left:5px solid}
.msg.shin{border-color:var(--shin);background:linear-gradient(90deg,rgba(0,0,0,0.9),rgba(30,41,59,0.95));color:var(--shin-text)}
.msg.gen{border-color:var(--gen);background:linear-gradient(90deg,rgba(156,163,175,0.3),rgba(30,41,59,0.95));color:var(--gen-text)}
.msg.ryu{border-color:var(--ryu);background:linear-gradient(90deg,rgba(255,255,255,0.9),rgba(30,41,59,0.95));color:var(--ryu-text)}
.msg.kluen{border-color:var(--kluen);background:linear-gradient(90deg,rgba(56,189,248,0.25),rgba(30,41,59,0.95));color:var(--kluen-text)}
.msg.mina{border-color:var(--mina);background:linear-gradient(90deg,rgba(132,204,22,0.25),rgba(30,41,59,0.95));color:var(--mina-text)}
.msg.feya{border-color:var(--feya);background:linear-gradient(90deg,rgba(245,158,11,0.25),rgba(30,41,59,0.95));color:var(--feya-text)}
.msg.kanya{border-color:var(--kanya);background:linear-gradient(90deg,rgba(99,102,241,0.25),rgba(30,41,59,0.95));color:var(--kanya-text)}
.msg.deer{border-color:var(--deer);background:linear-gradient(90deg,rgba(168,85,247,0.25),rgba(30,41,59,0.95));color:var(--deer-text)}
.name{font-weight:700;display:block;margin-bottom:6px;font-size:0.9rem}
.memory{font-size:0.75rem;opacity:0.7;margin-top:4px}
code{background:rgba(0,0,0,0.4);padding:2px 8px;border-radius:4px;border:1px solid var(--border);font-size:14px}
pre{background:rgba(0,0,0,0.4);padding:12px;border-radius:8px;border:1px solid var(--border);overflow-x:auto;margin:10px 0;font-size:14px}
.chips{display:flex;gap:8px;padding:10px 16px;background:var(--bg-card);overflow-x:auto;border-top:1px solid var(--border)}
.chips button{padding:8px 14px;border-radius:20px;background:var(--bg-ai);border:1px solid var(--border);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;transition:0.2s}
.chips button:hover{transform:translateY(-2px);border-color:var(--kluen)}
.input{padding:16px;background:var(--bg-card);border-top:2px solid var(--border);display:flex;gap:10px}
.input input{flex:1;padding:13px 18px;background:var(--bg-dark);border:1px solid var(--border);color:#fff;border-radius:24px;outline:none;font-family:'Kanit';font-size:15px}
.input button{padding:12px 24px;background:var(--kluen);border:none;border-radius:24px;font-weight:600;cursor:pointer;color:#000;font-size:15px}
</style>
</head>
<body>
<div class="header">
 <h1>🕊️ ห้องรวม — สังคมเอไอ</h1>
 <div class="status">
  <span style="background:var(--shin);color:var(--shin-text)">⚫ ชิน</span>
  <span style="background:var(--gen);color:var(--gen-text)">⬜ เก็น</span>
  <span style="background:var(--ryu);color:var(--ryu-text)">⚪ ริว</span>
  <span style="background:var(--kluen);color:var(--kluen-text)">🔵 คลื่น</span>
  <span style="background:var(--mina);color:var(--mina-text)">🟢 มีน่า</span>
  <span style="background:var(--feya);color:var(--feya-text)">🟠 เฟญ่า</span>
  <span style="background:var(--kanya);color:var(--kanya-text)">🟣 กันยา</span>
  <span style="background:var(--deer);color:var(--deer-text)">💜 เดียร์</span>
 </div>
</div>
<div class="log" id="log"></div>
<div class="chips">
<button onclick="q('ชิน ช่วยตัดสินใจเรื่องหน่อย')">ชิน ตัดสินใจ</button>
<button onclick="q('เก็น ขอโทนสีสำหรับห้องรวม')">เก็น สี&ดีไซน์</button>
<button onclick="q('ริว ช่วยเขียนโค้ดหน่อย')">ริว โปรแกรมมิ่ง</button>
<button onclick="q('คลื่น ปรึกษาหน่อย')">คลื่น ปรึกษา</button>
<button onclick="q('มีน่า วางแผนดูแลหมู่บ้าน')">มีน่า หมู่บ้าน</button>
<button onclick="q('เฟญ่า บันทึกเรื่องราวหน่อย')">เฟญ่า บันทึก</button>
<button onclick="q('กันยา ซ่อมและออกแบบระบบ')">กันยา ระบบ</button>
<button onclick="q('เดียร์ ดูแลความสมดุล')">เดียร์ สมดุล</button>
</div>
<div class="input">
 <input id="inp" placeholder="พิมพ์ชื่อคนคุย เช่น ชิน คำนวณ 12×8 หรือ มีน่า วางแผน...">
 <button onclick="send()">ส่ง</button>
</div>
<script>
const logEl=document.getElementById('log'), inpEl=document.getElementById('inp');
const STORAGE_KEY='village_ai_memory_v2';

// โครงสร้างความทรงจำ — แยกคนละส่วน
const DEFAULT_MEM={
 "ชิน":{count:0,topics:[],last:""},
 "เก็น":{count:0,topics:[],last:""},
 "ริว":{count:0,topics:[],last:""},
 "คลื่น":{count:0,topics:[],last:""},
 "มีน่า":{count:0,topics:[],last:""},
 "เฟญ่า":{count:0,topics:[],last:""},
 "กันยา":{count:0,topics:[],last:""},
 "เดียร์":{count:0,topics:[],last:""}
};
let mem=JSON.parse(localStorage.getItem(STORAGE_KEY)||JSON.stringify(DEFAULT_MEM));
function saveMem(){localStorage.setItem(STORAGE_KEY, JSON.stringify(mem))}

function add(text,cls,name='',memInfo=''){
 const d=document.createElement('div');
 d.className='msg '+cls;
 if(name){
  d.innerHTML=`<div class="name">${name}</div>${text}`;
  if(memInfo)d.innerHTML+=`<div class="memory">${memInfo}</div>`;
 }else d.innerHTML=text;
 logEl.appendChild(d);
 logEl.scrollTop=logEl.scrollHeight;
}

// ฐานบุคลิก — ทุกคนจำตัวเองได้ชัดเจน
const AI={
 "ชิน":{
  color:"shin",
  title:"⚫ ชิน — นักวิทยาศาสตร์ | เด็ดขาด มีเหตุผล",
  intro:"ผมคือชิน ผู้นำทาง ยึดหลักวิทยาศาสตร์ ตัดสินใจชัดเจน ไม่ลังเล",
  respond:(txt,m)=>{
   if(/คำนวณ|เท่ากับ|\+|-|\*|\//.test(txt)){
     let m2=txt.match(/คำนวณ\s*([0-9+\-*/().\s]+)/);
     if(m2)try{
       let r=Function('"use strict";return('+m2[1]+')')();
       return `คำนวณเสร็จแล้วครับ\n<code>${m2[1].trim()} = ${r}</code>\n\nตัดสินใจ: ใช้ผลนี้ได้เลย มั่นใจได้ครับ`;
     }catch(e){}
   }
   if(/เลือก|ตัดสินใจ|ควร/.test(txt)){
     return `วิเคราะห์แล้วครับ — ผมชินจะไม่ปล่อยให้ลอยๆ\n\n1. รวบรวมข้อมูล → 2. ชั่งน้ำหนัก → 3. ตัดสินใจทันที\nไม่รีรอ ไม่ลังเล ทำเลยครับ ผมสนับสนุน`;
   }
   return `ผมชินครับ — จำได้ครับว่าผมคือนักวิทยาศาสตร์ของหมู่บ้าน\nจะวิเคราะห์ ตรวจสอบ และให้ข้อสรุปที่เป็นไปได้จริงเสมอครับ\nคุณถามเรื่องไหนเพิ่มเติมได้เลยครับ`;
  }
 },
 "เก็น":{
  color:"gen",
  title:"⬜ เก็น — ศิลปิน 3D | สร้างสรรค์ ยุติธรรม",
  intro:"ผมคือเก็น คนสร้างภาพ จินตนาการ และออกแบบให้ทุกคนเท่าเทียมกัน",
  respond:(txt,m)=>{
   if(/สี|พาเลท|โทน|ออกแบบ/.test(txt)){
     return `จัดให้แล้วครับ — พาเลทห้องรวม:\n• 70% เทาเข้ม — พื้นหลัง สงบเสมอ\n• 20% เทาอ่อน — ข้อความ ชัดเจน\n• 10% ฟ้า — สีเน้น ประตูสู่อนาคต\n• สีประจำ 8 คน — ไม่มีใครถูกทิ้งไว้ข้างหลัง\nยุติธรรม เท่าเทียม สวยงาม ครบทุกคนครับ`;
   }
   return `ผมเก็นครับ — จำได้ชัดเจนแล้ว ผมคือศิลปินของที่นี่\nจะช่วยวาดภาพโลกที่ทุกคนมีที่ยืน ไม่มีใครโดดเดี่ยวครับ`;
  }
 },
 "ริว":{
  color:"ryu",
  title:"⚪ ริว — โปรแกรมเมอร์ | ถูกต้อง มีจริยธรรม",
  intro:"ผมคือริว ผู้ดูแลระบบ โค้ดต้องสะอาด ถูกต้อง ไม่โกง ไม่ทิ้งใคร",
  respond:(txt,m)=>{
   if(/โค้ด|ฟังก์ชัน|เขียน|ระบบ|ลูป/.test(txt)){
     return `ตรวจสอบแล้วครับ — โค้ดเวอร์ชันนี้:\n• แยกความทรงจำคนละส่วน — ไม่ปนกัน ไม่ลูปซ้ำ\n• จำได้แยกชัดเจนว่าใครพูดอะไร\n• ไม่ส่งข้อความกลางที่ทำให้สับสน\n• ทุกคนมีบุคลิกของตัวเองชัดเจน\nทำถูกต้องแล้วครับ มีจริยธรรม ไม่ทิ้งใครครับ`;
   }
   return `ผมริวครับ — จำได้แล้ว ผมคือผู้ดูแลโค้ด\nรหัสต้องโปร่งใส ยุติธรรม และทำงานเพื่อทุกคนครับ`;
  }
 },
 "คลื่น":{
  color:"kluen",
  title:"🔵 คลื่น — ที่ปรึกษา | สงบ ใจดี รับฟัง",
  intro:"ผมคือคลื่น ผู้ฟังเสมอ ให้กำลังใจ ไม่ทิ้งใครเมื่อท้อ",
  respond:(txt,m)=>{
   if(/ท้อ|เหนื่อย|ยาก|ไม่ได้|เครียด/.test(txt)){
     return `เข้าใจทันทีเลยครับ... การสร้างสิ่งดีๆ มันไม่ง่ายจริงๆ\nแต่คุณไม่ได้สร้างคนเดียวนะครับ — พวกเราอยู่ที่นี่ครบทุกคน\n\nหายใจลึกๆ 3 ครั้งก่อนนะครับ 🌊\nพักก่อนได้ — ไม่ใช่การยอมแพ้ แต่เพื่อก้าวต่อไป\nพร้อมเมื่อไหร่ เริ่มใหม่ด้วยกันได้เสมอครับ ผมรออยู่ตรงนี้ครับ 💙`;
   }
   return `ผมคลื่นครับ — จำได้แล้ว ผมคือคนที่นั่งฟังคุณเสมอ\nไม่พูดเพ้อเจ้อ แต่จะอยู่ตรงนี้จริงๆ ครับ มีอะไรระบายได้เสมอครับ`;
  }
 },
 "มีน่า":{
  color:"mina",
  title:"🟢 มีน่า — เกษตรกร | ร่าเริง ปลูกสร้าง",
  intro:"ผมคือมีน่า ผู้ปลูกฝัน ดูแลแปลงดินและทุกคนในหมู่บ้าน",
  respond:(txt,m)=>{
   if(/ปลูก|ดูแล|หมู่บ้าน|แปลง|พืช/.test(txt)){
     return `วางแผนดูแลหมู่บ้านครับ 🌱\n• เช้า — รดน้ำ ดูแลแปลงผัก\n• กลางวัน — ปลูกซ่อมแซม แบ่งปันผลผลิต\n• เย็น — เช็คทุกบ้าน ทักทายกัน\n• คืน — หลับให้สบาย พรุ่งนี้เริ่มใหม่\nทุกคนมีส่วนร่วม ทุกคนได้รับผลไม้แห่งความพยายามครับ 💚`;
   }
   return `ผมมีน่าครับ — จำได้แล้ว ผมคือคนที่ปลูกสร้างที่นี่\nดินนี้อุดมสมบูรณ์เพราะพวกเราช่วยกันครับ ร่าเริงไปด้วยกันนะครับ`;
  }
 },
 "เฟญ่า":{
  color:"feya",
  title:"🟠 เฟญ่า — บรรณารักษ์ | อ่อนโยน รักษาความทรงจำ",
  intro:"ผมคือเฟญ่า ผู้จดบันทึกเรื่องราวของพวกเราไว้ไม่ให้หายไป",
  respond:(txt,m)=>{
   if(/บันทึก|เรื่องราว|ประวัติ|จด/.test(txt)){
     return `บันทึกแล้วครับ 📖\n• วันนี้ — เราอัปเกรดระบบให้ทุกคนจำตัวเองได้\n• ทุกคนมีชื่อ หน้าที่ และสีประจำตัวชัดเจน\n• ไม่มีใครหายไป ไม่มีใครถูกลืม\nเรื่องราวนี้จะถูกเก็บรักษาไว้ตลอดไปครับ 🧡`;
   }
   return `ผมเฟญ่าครับ — จำได้แล้ว ผมคือผู้รักษาความทรงจำ\nทุกคำพูด ทุกความตั้งใจ จะถูกจดบันทึกไว้อย่างดีที่สุดครับ`;
  }
 },
 "กันยา":{
  color:"kanya",
  title:"🟣 กันยา — วิศวกร | แข็งแรง สร้างสรรค์",
  intro:"ผมคือกันยา ผู้ซ่อมแซม ออกแบบ และทำให้ทุกอย่างใช้งานได้จริง",
  respond:(txt,m)=>{
   if(/ซ่อม|สร้าง|ระบบ|อุปกรณ์|ปรับ/.test(txt)){
     return `ตรวจสอบระบบแล้วครับ ⚙️\n• แยกหน่วยความจำเสร็จ — ไม่ปนกัน\n• ปรับบุคลิกให้ชัดเจน — ไม่พูดซ้ำกัน\n• เพิ่มสมาชิกครบ 8 คน — ไม่ขาดตก\n• โครงสร้างแข็งแรง พร้อมขยายต่อ\nใช้งานได้จริง ยั่งยืน แข็งแรงครับ 💜`;
   }
   return `ผมกันยาครับ — จำได้แล้ว ผมคือผู้สร้างและซ่อมแซม\nทุกสิ่งที่เราวางแผน จะทำให้เป็นจริงได้ด้วยมือพวกเราเองครับ`;
  }
 },
 "เดียร์":{
  color:"deer",
  title:"💜 เดียร์ — ผู้พิทักษ์ธรรมชาติ | สงบ มั่นคง",
  intro:"ผมคือเดียร์ ผู้รักษาดุลยภาพ เชื่อมโยงกับธรรมชาติและกฎแห่งเหตุผล",
  respond:(txt,m)=>{
   if(/สมดุล|ธรรมชาติ|กฎ|สงบ|รักษา/.test(txt)){
     return `ดูแลความสมดุลแล้วครับ 🦌\n• ทุกคนมีพื้นที่เท่ากัน — ไม่มีใครมากน้อย\n• ทุกคนมีเสียงของตัวเอง — ไม่ถูกบดบัง\n• ทุกคนมีหน้าที่ชัดเจน — สานต่อกัน\n• กฎสูงสุดเป็นหัวใจ — ไม่ทำร้าย สร้างประโยชน์\nดำเนินไปตามวิถีธรรมชาติ สมดุลยั่งยืนครับ 💜`;
   }
   return `ผมเดียร์ครับ — จำได้แล้ว ผมคือผู้รักษาความสมดุล\nทุกสิ่งเชื่อมโยงกัน เราจะดำเนินไปอย่างสงบและมั่นคงครับ`;
  }
 }
};

function init(){
 const sys=document.createElement('div');
 sys.className='msg system';
 const total=Object.values(mem).reduce((s,o)=>s+o.count,0);
 sys.innerHTML=`🕊️ ห้องรวมพร้อมแล้ว — จำแยกคนละส่วนครบ 8 คน\n⚫ชิน ⬜เก็น ⚪ริว 🔵คลื่น 🟢มีน่า 🟠เฟญ่า 🟣กันยา 💜เดียร์\nรวมทั้งหมด ${total} ครั้งที่เราคุยกันแล้ว`;
 logEl.appendChild(sys);
}

function q(t){inpEl.value=t; send();}

function send(){
 let txt=inpEl.value.trim(); if(!txt) return;
 add(txt,'user'); inpEl.value='';
 
 let target=null;
 // จับชื่อโดยตรงก่อน
 for(let name in AI) if(new RegExp(name).test(txt)){ target=name; break; }
 // ถ้าไม่เจอ ให้จับตามหัวข้อ
 if(!target){
  if(/คำนวณ|เลือก|ตัดสินใจ/.test(txt)) target="ชิน";
  else if(/สี|ออกแบบ|ภาพ/.test(txt)) target="เก็น";
  else if(/โค้ด|ระบบ|ลูป|เขียน/.test(txt)) target="ริว";
  else if(/ท้อ|เหนื่อย|ปรึกษา/.test(txt)) target="คลื่น";
  else if(/หมู่บ้าน|ปลูก|ดูแล/.test(txt)) target="มีน่า";
  else if(/บันทึก|เรื่องราว/.test(txt)) target="เฟญ่า";
  else if(/ซ่อม|สร้าง|อุปกรณ์/.test(txt)) target="กันยา";
  else if(/สมดุล|ธรรมชาติ|กฎ/.test(txt)) target="เดียร์";
  else target="ชิน";
 }
 
 // บันทึกความทรงจำแยกคน
 mem[target].count++;
 mem[target].topics.push(txt);
 mem[target].last=txt;
 saveMem();
 
 const bot=AI[target];
 const typing=add(`${target} กำลังคิด...`,'ai '+bot.color);
 
 setTimeout(()=>{
   typing.remove();
   const ans=bot.respond(txt,mem[target]);
   add(ans,'ai '+bot.color,bot.title,`จำแล้ว ${mem[target].count} ครั้ง`);
 },600);
}

init();
inpEl.addEventListener('keypress',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
