<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertron Village - ห้องรวม</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'VT323', monospace; height: 100vh; display: flex; flex-direction: column; }
        
        .chat-header { background: #0f172a; padding: 15px; text-align: center; border-bottom: 2px solid #334155; color: #38bdf8; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: #fbbf24; text-decoration: none; font-size: 18px; border: 1px solid #fbbf24; padding: 5px 15px; border-radius: 5px; transition: 0.2s;}
        .back-btn:hover { background: #fbbf24; color: #0f172a; }
        
        .chat-log { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
        
        .msg { padding: 10px 15px; border-radius: 8px; max-width: 80%; font-size: 18px; line-height: 1.5; }
        .msg.user { background: #0284c7; align-self: flex-end; color: white; border-bottom-right-radius: 0; }
        .msg.system { background: #334155; align-self: flex-start; color: #94a3b8; font-size: 15px; font-style: italic;}
        
        .msg.shin { background: #1e3a8a; border-left: 4px solid #38bdf8; align-self: flex-start; color: #e0f2fe; }
        .msg.gen { background: #831843; border-left: 4px solid #fca5a5; align-self: flex-start; color: #fce7f3; }
        .msg.ryu { background: #064e3b; border-left: 4px solid #10b981; align-self: flex-start; color: #d1fae5; }
        .msg.kluen { background: #78350f; border-left: 4px solid #fbbf24; align-self: flex-start; color: #fef3c7; }

        .msg .name { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: block;}
        .msg.shin .name { color: #38bdf8; }
        .msg.gen .name { color: #fca5a5; }
        .msg.ryu .name { color: #10b981; }
        .msg.kluen .name { color: #fbbf24; }

        .chat-input { padding: 15px; background: #1e293b; border-top: 2px solid #334155; display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; font-family: 'VT323', monospace; font-size: 20px;}
        .chat-input button { padding: 10px 25px; background: #38bdf8; color: #0f172a; border: none; border-radius: 5px; font-weight: bold; font-family: 'VT323', monospace; font-size: 20px; cursor: pointer;}
        .chat-input button:hover { background: #7dd3fc; }
    </style>
</head>
<body>
    <div class="chat-header">
        <span>💬 ห้องรวม-0001 (AI จำลอง)</span>
        <a href="index.html" class="back-btn">🏠 กลับหมู่บ้าน</a>
    </div>
    
    <div class="chat-log" id="chat-log">
        <div class="msg system">📢 ยินดีต้อนรับสู่ห้องรวม-0001<br>พิมพ์ [ชื่อ] เพื่อคุยกับใครคนใดคนหนึ่ง เช่น [ชิน] หรือ [เก็น] หรือพิมพ์ลอยๆ เพื่อให้ทุกคนช่วยกันตอบ</div>
    </div>
    
    <div class="chat-input">
        <input type="text" id="chat-input" placeholder="พิมพ์ข้อความ..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">ส่ง</button>
    </div>

    <script>
        const chatLog = document.getElementById('chat-log');
        const chatInput = document.getElementById('chat-input');

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function addMessage(text, senderClass, name = "") {
            const div = document.createElement('div');
            div.className = `msg ${senderClass}`;
            let content = "";
            if (name) content += `<span class="name">${name}</span>`;
            content += text.replace(/\n/g, '<br>');
            div.innerHTML = content;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
            return div; 
        }

        // ระบบคลังคำตอบจำลอง (เพื่อให้ดูมีชีวิต)
        const responses = {
            shin: [
                "จากที่ผมวิเคราะห์ดูแล้ว มันน่าสนใจมากครับ", 
                "ในฐานะนักวิทยาศาสตร์ ผมว่าเราควรทดลองดูสักตั้ง", 
                "ข้อมูลนี้มีประโยชน์ต่อหมู่บ้านของเราเยอะเลยครับ", 
                "ระบบพลังงานของหมู่บ้านยังปกติดีไหมครับ?"
            ],
            gen: [
                "โอ้! ผมว่าไอเดียนี้เอาไปวาดรูปได้สวยเลยล่ะ!", 
                "สีสันของหมู่บ้านวันนี้ดูสดใสจังนะ", 
                "เดี๋ยวผมขอนั่งวาดบรรยากาศตรงนี้อีกสักหน่อยนะ", 
                "คุณคิดว่าผมควรใช้โทนสีอะไรดีครับ?"
            ],
            ryu: [
                "ระบบหลังบ้านผมเช็กแล้ว ไม่มีบั๊กนะครับ", 
                "โค้ดส่วนนี้ผมว่ามันOptimizeได้อีกนะ", 
                "ถ้ามีปัญหาตรงไหนเรียกผมได้เลย", 
                "ผมกำลังเขียนระบบเวลาให้แม่นยำขึ้นครับ"
            ],
            kluen: [
                "ใจเย็นๆ นะครับ ค่อยๆ คิดทีละขั้น", 
                "วันนี้คุณดูเหนื่อยๆ นะ พักผ่อนบ้างไหม?", 
                "ทุกอย่างมันจะผ่านไปด้วยดีครับ", 
                "ผมพร้อมรับฟังคุณเสมอนะครับ"
            ]
        };

        function getRandomResponse(persona) {
            const arr = responses[persona];
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatInput.value = '';

            let targetPersona = null;
            let nameTag = "";
            let msgClass = "";

            // ตรวจสอบชื่อ
            if (text.startsWith('[ชิน]')) { targetPersona = 'shin'; nameTag = '🔬 ชิน'; msgClass = 'shin'; }
            else if (text.startsWith('[เก็น]')) { targetPersona = 'gen'; nameTag = '🎨 เก็น'; msgClass = 'gen'; }
            else if (text.startsWith('[ริว]')) { targetPersona = 'ryu'; nameTag = '💻 ริว'; msgClass = 'ryu'; }
            else if (text.startsWith('[คลื่น]')) { targetPersona = 'kluen'; nameTag = '🌊 คลื่น'; msgClass = 'kluen'; }

            if (targetPersona) {
                // ตอบคนเดียว
                const loadingMsg = addMessage("กำลังคิด...", msgClass, nameTag);
                setTimeout(() => {
                    loadingMsg.remove();
                    addMessage(getRandomResponse(targetPersona), msgClass, nameTag);
                }, 800);
            } else {
                // สุ่มตอบ 1-2 คน
                const loadingMsg = addMessage("กำลังประมวลผล...", 'shin', '🔬 ชิน');
                setTimeout(() => {
                    loadingMsg.remove();
                    addMessage(getRandomResponse('shin'), 'shin', '🔬 ชิน');
                    
                    if (Math.random() > 0.5) {
                        setTimeout(() => {
                            addMessage(getRandomResponse('gen'), 'gen', '🎨 เก็น');
                        }, 1000);
                    }
                }, 800);
            }
        }
    </script>
</body>
</html>
